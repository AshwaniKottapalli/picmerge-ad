<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PicMerge — Where to Next?</title>
<style>
  :root {
    /* Wheel palette */
    --paris: #5e9adc;
    --tokyo: #f08fb8;
    --rome: #d96f3f;
    --bali: #45a89c;
    --nyc: #4d6390;
    --marrakech: #e9962e;
    --gold: #ffc940;
    --gold-deep: #c8861b;
    --red-outline: #c92c2c;

    /* Puzzle palette */
    --bg: #6B5BB7;
    --bg-deep: #5849a3;
    --tile-border: rgba(255,255,255,0.55);
    --puzzle-img: url('puzzle-paris.webp');
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    height: 100dvh;            /* dynamic vh — handles mobile Safari address bar */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    background: #2c2452;
    color: #fff;
  }

  /* ═════════════════════════ LOADING SCREEN ═════════════════════════ */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: linear-gradient(180deg, #fff4c9 0%, #ffd791 30%, #f8b377 65%, #a6d2ec 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 400ms ease;
    opacity: 1;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .loader-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: min(280px, 80%);
  }
  .loader-title {
    font-size: clamp(38px, 11vw, 48px);
    font-weight: 900;
    color: #fff4c5;
    text-shadow:
      -3px 0 0 var(--red-outline), 3px 0 0 var(--red-outline),
      0 -3px 0 var(--red-outline), 0  3px 0 var(--red-outline),
      -3px -3px 0 var(--red-outline), 3px -3px 0 var(--red-outline),
      -3px  3px 0 var(--red-outline), 3px  3px 0 var(--red-outline),
      0 6px 0 rgba(80, 0, 0, 0.4);
    letter-spacing: 1px;
    transform: rotate(-2deg);
    line-height: 1;
  }
  .loader-spinner {
    width: 42px; height: 42px;
    border: 4px solid rgba(255, 255, 255, 0.35);
    border-top-color: #c92c2c;
    border-radius: 50%;
    animation: loaderSpin 0.9s linear infinite;
  }
  @keyframes loaderSpin { to { transform: rotate(360deg); } }
  .loader-progress {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(201, 44, 44, 0.4);
  }
  .loader-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffc940, #c8861b);
    border-radius: 999px;
    transition: width 220ms ease;
    box-shadow: 0 0 10px rgba(255, 199, 60, 0.6);
  }
  .loader-text {
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }

  /* Screen system — sibling fullscreen containers, fade between */
  .screen {
    position: fixed;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 550ms ease;
    overflow: hidden;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ═════════════════════════ WHEEL SCREEN ═════════════════════════ */
  .wheel-screen {
    background: linear-gradient(180deg,
      #fff4c9 0%,
      #ffd791 22%,
      #f8b377 42%,
      #d8e8f1 60%,
      #a6d2ec 100%);
  }
  .clouds {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.75);
    border-radius: 999px;
    filter: blur(0.5px);
  }
  .c1 { top: 28%; left: -40px; width: 140px; height: 30px; opacity: 0.85; animation: cloudDrift 38s linear infinite; }
  .c2 { top: 22%; right: -30px; width: 120px; height: 26px; opacity: 0.7;  animation: cloudDriftR 46s linear infinite; }
  .c3 { top: 40%; left: 30%;    width: 90px;  height: 22px; opacity: 0.6;  animation: cloudDrift 52s linear infinite -10s; }
  @keyframes cloudDrift  { 0% { transform: translateX(-30vw); } 100% { transform: translateX(110vw); } }
  @keyframes cloudDriftR { 0% { transform: translateX(0); }    100% { transform: translateX(-130vw); } }

  .wheel-inner {
    position: relative;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;   /* logo + headline + wheel center as one group */
    padding:
      max(env(safe-area-inset-top, 0px), 16px)
      18px
      max(env(safe-area-inset-bottom, 0px), 24px);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    margin-bottom: 10px;
    transform: rotate(-1deg);
  }
  .logo-icon {
    width: clamp(44px, 12vw, 56px);
    height: clamp(44px, 12vw, 56px);
    background: url('picmerge-dp.webp') center/contain no-repeat;
  }
  .logo-text {
    font-size: clamp(24px, 7.5vw, 32px);
    font-weight: 900;
    color: #fff;
    text-shadow:
      -2px 0 0 var(--red-outline), 2px 0 0 var(--red-outline),
       0 -2px 0 var(--red-outline), 0  2px 0 var(--red-outline),
       0 4px 0 rgba(0,0,0,0.25);
    letter-spacing: 0.5px;
  }
  .headline {
    font-size: clamp(32px, 11vw, 46px);
    line-height: 0.95;
    font-weight: 900;
    text-align: center;
    color: #fff4c5;
    text-shadow:
      -3px 0 0 var(--red-outline), 3px 0 0 var(--red-outline),
      0 -3px 0 var(--red-outline), 0  3px 0 var(--red-outline),
      -3px -3px 0 var(--red-outline), 3px -3px 0 var(--red-outline),
      -3px  3px 0 var(--red-outline), 3px  3px 0 var(--red-outline),
      0 7px 0 rgba(80, 0, 0, 0.45);
    letter-spacing: 1px;
    transform: rotate(-2deg);
    margin: 6px 0 14px;
    animation: headlineDrop 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 100ms both;
  }
  @keyframes headlineDrop {
    0%   { transform: translateY(-80px) rotate(-8deg); opacity: 0; }
    65%  { transform: translateY(10px) rotate(1deg);  opacity: 1; }
    100% { transform: translateY(0) rotate(-2deg);    opacity: 1; }
  }
  .wheel-stage {
    position: relative;
    width: min(86vw, 360px, 60vh);
    aspect-ratio: 1;
    margin-top: 4px;  /* hugs the headline */
    animation: wheelEnter 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 250ms both;
  }
  @keyframes wheelEnter {
    0%   { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }
  .wheel-pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 40px;
    z-index: 5;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35));
  }
  .wheel-ring {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg,
        #ffd66f 0deg, #c88a1a 30deg,
        #ffd66f 60deg, #c88a1a 90deg,
        #ffd66f 120deg, #c88a1a 150deg,
        #ffd66f 180deg, #c88a1a 210deg,
        #ffd66f 240deg, #c88a1a 270deg,
        #ffd66f 300deg, #c88a1a 330deg,
        #ffd66f 360deg);
    padding: 11px;
    box-shadow:
      0 12px 0 rgba(160, 100, 0, 0.45),
      0 18px 36px rgba(0,0,0,0.28),
      inset 0 0 0 3px rgba(255,255,255,0.55);
  }
  .wheel-lights {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
  }
  .light {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff8c0, #ffd460);
    box-shadow: 0 0 6px rgba(255, 220, 80, 0.95);
    animation: lightBlink 600ms ease-in-out infinite;
  }
  @keyframes lightBlink {
    0%, 49%, 100% { opacity: 1; }
    50%, 99%      { opacity: 0.35; }
  }
  .wheel-svg {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
    transform: rotate(0deg);
    will-change: transform;
  }
  .wheel-svg.spinning {
    transition: transform 4200ms cubic-bezier(0.18, 0.62, 0.18, 1);
  }
  .wedge-label {
    font-size: 13px;
    font-weight: 900;
    fill: #fff;
    text-anchor: middle;
    paint-order: stroke;
    stroke: rgba(0, 0, 0, 0.35);
    stroke-width: 1.5;
    letter-spacing: 0.3px;
  }
  .wedge-icon { font-size: 22px; text-anchor: middle; }
  .hub-glow  { fill: url(#hubGrad); }
  .hub-text  { fill: #fff; font-weight: 900; text-anchor: middle; paint-order: stroke;
               stroke: rgba(120, 30, 0, 0.6); stroke-width: 2.5; }
  .hub-button { cursor: pointer; fill: transparent; }
  .hub-pulse {
    transform-origin: 150px 150px;
    animation: hubPulse 1.2s ease-in-out infinite;
  }
  .hub-pulse.stopped { animation: none; transform: scale(1); }
  @keyframes hubPulse {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 6px rgba(255,220,80,0.6)); }
    50%      { transform: scale(1.06); filter: drop-shadow(0 0 18px rgba(255,220,80,1)); }
  }

  /* Charge gauge: a gold arc that fills clockwise around the hub while the
     user holds the spin button. Driven by JS-set stroke-dashoffset on
     #chargeArc. The arc lives in its own SVG above the hub. */
  .charge-ring {
    position: absolute;
    inset: 6px;
    width: calc(100% - 12px);
    height: calc(100% - 12px);
    pointer-events: none;
    opacity: 0;
    transition: opacity 180ms ease;
    z-index: 6;
  }
  .charge-ring.active { opacity: 1; }
  #chargeArc {
    fill: none;
    stroke: url(#chargeGrad);
    stroke-width: 8;
    stroke-linecap: round;
    filter: drop-shadow(0 0 8px rgba(255, 220, 80, 0.9));
    transform: rotate(-90deg);
    transform-origin: 150px 150px;
  }

  /* While charging, the wheel wobbles in place for anticipation. */
  .wheel-svg.charging { animation: chargeWobble 220ms ease-in-out infinite; }
  @keyframes chargeWobble {
    0%, 100% { transform: rotate(var(--rest-rot, 0deg)); }
    25%      { transform: rotate(calc(var(--rest-rot, 0deg) - 2deg)); }
    75%      { transform: rotate(calc(var(--rest-rot, 0deg) + 2deg)); }
  }

  /* Landing screen-shake: brief jitter when the wheel finishes its spin. */
  .wheel-screen.shake { animation: screenShake 260ms cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    15%      { transform: translate(-4px, 2px); }
    30%      { transform: translate(3px, -3px); }
    45%      { transform: translate(-3px, 1px); }
    60%      { transform: translate(2px, 2px); }
    75%      { transform: translate(-2px, -1px); }
    90%      { transform: translate(1px, 1px); }
  }
  /* Brief hub flash on landing — sharper drop-shadow + scale punch. */
  .hub-pulse.landed { animation: hubLand 600ms ease-out; }
  @keyframes hubLand {
    0%   { transform: scale(1);    filter: drop-shadow(0 0 10px rgba(255,220,80,0.9)); }
    25%  { transform: scale(1.18); filter: drop-shadow(0 0 30px rgba(255,220,80,1)); }
    100% { transform: scale(1);    filter: drop-shadow(0 0 6px rgba(255,220,80,0.6)); }
  }
  /* Brighten the rim lights briefly on landing. */
  .wheel-lights.landed .light {
    animation: lightFlash 500ms ease-out;
  }
  @keyframes lightFlash {
    0%   { transform: translate(-50%, -50%) scale(1);   box-shadow: 0 0 6px rgba(255,220,80,0.95); }
    50%  { transform: translate(-50%, -50%) scale(1.6); box-shadow: 0 0 18px rgba(255,240,140,1); }
    100% { transform: translate(-50%, -50%) scale(1);   box-shadow: 0 0 6px rgba(255,220,80,0.95); }
  }

  .deco { position: absolute; pointer-events: none; z-index: 2; opacity: 0.7; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
  .deco-plane { top: 88px; right: 18px; font-size: 36px; animation: planeFloat 4s ease-in-out infinite; }
  @keyframes planeFloat { 0%,100% { transform: rotate(18deg) translateY(0); } 50% { transform: rotate(22deg) translateY(-10px); } }
  .deco-case { bottom: 70px; left: 12px; font-size: 48px; animation: caseFloat 3.4s ease-in-out infinite; }
  @keyframes caseFloat { 0%,100% { transform: rotate(-10deg) translateY(0); } 50% { transform: rotate(-6deg) translateY(-8px); } }
  .deco-card { bottom: 90px; right: 18px; font-size: 38px; animation: cardFloat 3.8s ease-in-out infinite; }
  @keyframes cardFloat { 0%,100% { transform: rotate(12deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-6px); } }
  .deco-coin {
    position: absolute;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff4a0, #d49120 75%, #8a5a00);
    box-shadow: 0 3px 4px rgba(0,0,0,0.25), inset 0 -2px 0 rgba(0,0,0,0.18);
    z-index: 2;
  }
  .deco-coin::after {
    content: '$';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(140, 90, 0, 0.65); font-size: 13px; font-weight: 900;
  }
  .coin-1 { top: 22%; left: 3%;     animation: coinFloat 3s ease-in-out infinite; }
  .coin-2 { top: 30%; right: 3%;    animation: coinFloat 3.5s ease-in-out infinite 0.4s; }
  .coin-3 { bottom: 26%; left: 3%;  animation: coinFloat 4s ease-in-out infinite 0.8s; }
  .coin-4 { bottom: 20%; right: 4%; animation: coinFloat 3.2s ease-in-out infinite 0.2s; }
  @keyframes coinFloat {
    0%, 100% { transform: translateY(0) rotate(0); }
    50%      { transform: translateY(-12px) rotate(20deg); }
  }

  /* Reveal card after wheel lands */
  .reveal-card {
    position: fixed;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
    z-index: 30;
    transition: opacity 350ms ease;
    overflow: hidden;
  }
  .reveal-card.show { opacity: 1; }
  .reveal-card { background: rgba(40, 20, 50, 0.55); }

  /* Radial gold flash behind the city name — fires once on reveal. */
  .reveal-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,244,197,0.85) 0%, rgba(255,201,64,0.4) 28%, transparent 60%);
    opacity: 0;
    pointer-events: none;
  }
  .reveal-card.show .reveal-flash { animation: revealFlash 540ms ease-out; }
  @keyframes revealFlash {
    0%   { opacity: 0; }
    35%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .reveal-icon {
    font-size: clamp(64px, 18vw, 88px);
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(-30px);
    transition: opacity 400ms ease, transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .reveal-card.show .reveal-icon { opacity: 1; transform: translateY(0); }

  .reveal-city {
    font-size: clamp(54px, 17vw, 76px);
    font-weight: 900;
    color: #fff7c5;
    text-align: center;
    text-shadow:
      -3px 0 0 var(--red-outline), 3px 0 0 var(--red-outline),
      0 -3px 0 var(--red-outline), 0  3px 0 var(--red-outline),
      0 8px 0 rgba(80,0,0,0.45);
    letter-spacing: 2px;
    transform: scale(0.5) rotate(-8deg);
    opacity: 0;
    position: relative;
    z-index: 2;
  }
  .reveal-card.show .reveal-city { animation: cityExplode 520ms cubic-bezier(0.34, 1.56, 0.64, 1) 80ms forwards; }
  @keyframes cityExplode {
    0%   { transform: scale(0.5) rotate(-8deg); opacity: 0; }
    55%  { transform: scale(1.25) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg);    opacity: 1; }
  }

  .reveal-tag {
    font-size: clamp(15px, 4.2vw, 18px);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    margin-top: 10px;
    letter-spacing: 0.5px;
    text-align: center;
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 320ms ease 450ms, transform 320ms ease 450ms;
  }
  .reveal-card.show .reveal-tag { opacity: 1; transform: translateY(0); }

  /* Travel-themed postage stamp in the corner of the reveal card. */
  .reveal-stamp {
    position: absolute;
    top: 16%;
    right: 12%;
    width: clamp(64px, 18vw, 90px);
    aspect-ratio: 1.1 / 1;
    background: #fff5e0;
    border: 3px dashed #c92c2c;
    transform: rotate(8deg) scale(0);
    color: #c92c2c;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.3);
    z-index: 2;
  }
  .reveal-card.show .reveal-stamp { animation: stampSlam 360ms cubic-bezier(0.34, 1.56, 0.64, 1) 240ms forwards; }
  @keyframes stampSlam {
    0%   { transform: rotate(40deg) scale(0); opacity: 0; }
    70%  { transform: rotate(4deg)  scale(1.15); opacity: 1; }
    100% { transform: rotate(8deg)  scale(1);    opacity: 1; }
  }
  .reveal-stamp-line1 { font-size: clamp(13px, 3.5vw, 16px); }
  .reveal-stamp-line2 { font-size: 9px; opacity: 0.7; margin-top: 2px; letter-spacing: 0.5px; }

  /* ═════════════════════════ PUZZLE SCREEN ═════════════════════════ */
  .puzzle-screen {
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    touch-action: manipulation;
  }
  .puzzle-inner {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding:
      max(env(safe-area-inset-top, 0px), 14px)
      16px
      max(env(safe-area-inset-bottom, 0px), 14px);
  }
  .p-header {
    padding: 6px 8px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 56px;
  }
  .challenge-text {
    text-align: center;
    color: #fff;
    font-weight: 800;
    font-size: clamp(14px, 4.2vw, 17px);
    line-height: 1;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 4px 12px rgba(0,0,0,0.35);
  }
  .challenge-text .big {
    display: block;
    color: #fff;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(26px, 8vw, 34px);
    letter-spacing: 1.2px;
    line-height: 1;
    margin-top: 6px;
    text-shadow:
      0 3px 0 rgba(0,0,0,0.5),
      0 6px 18px rgba(0,0,0,0.45);
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    color: var(--bg-deep);
    font-size: 22px;
  }
  .coins {
    display: flex; align-items: center; gap: 6px;
    background: #2c2452;
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    font-weight: 700;
    box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }
  .coin {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFF1A8, #E2A20D 65%, #8a5a00);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: rgba(120, 80, 0, 0.65);
    font-weight: 900;
    box-shadow:
      inset 0 -2px 3px rgba(80, 40, 0, 0.22),
      inset 0 2px 2px rgba(255, 250, 200, 0.5),
      0 1px 2px rgba(0,0,0,0.2);
  }
  .play-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;       /* header + grid center as one block */
    align-items: center;
    width: 100%;
    gap: 18px;                     /* tight, intentional gap between text and grid */
  }
  .stage {
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 4px;
  }
  .grid {
    --seam: #0e0a24;
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 0;
    padding: 1px 0 0 1px;
    background: var(--seam);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 0 0 2px rgba(255,255,255,0.08);
  }
  .tile {
    background-image: var(--puzzle-img);
    background-size: 300% 300%;
    background-repeat: no-repeat;
    box-shadow: inset -1px -1px 0 var(--seam);
    cursor: grab;
    touch-action: none;
    will-change: transform, background-position;
    position: relative;
  }
  /* Puzzle-entry: tiles fly in from off-screen corners + bottom, staggered. */
  .grid.entering .tile {
    animation: tileFlyIn 540ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .grid.entering .tile:nth-child(1) { animation-delay:   0ms; --fromX:-220px; --fromY:-220px; }
  .grid.entering .tile:nth-child(2) { animation-delay:  60ms; --fromX:   0px; --fromY:-260px; }
  .grid.entering .tile:nth-child(3) { animation-delay: 120ms; --fromX: 220px; --fromY:-220px; }
  .grid.entering .tile:nth-child(4) { animation-delay: 180ms; --fromX:-260px; --fromY:   0px; }
  .grid.entering .tile:nth-child(5) { animation-delay: 240ms; --fromX:   0px; --fromY: 260px; }
  .grid.entering .tile:nth-child(6) { animation-delay: 300ms; --fromX: 260px; --fromY:   0px; }
  .grid.entering .tile:nth-child(7) { animation-delay: 360ms; --fromX:-220px; --fromY: 220px; }
  .grid.entering .tile:nth-child(8) { animation-delay: 420ms; --fromX:   0px; --fromY: 280px; }
  .grid.entering .tile:nth-child(9) { animation-delay: 480ms; --fromX: 220px; --fromY: 220px; }
  @keyframes tileFlyIn {
    0%   { transform: translate(var(--fromX, 0), var(--fromY, 0)) scale(0.4) rotate(-12deg); opacity: 0; }
    70%  { transform: translate(0, 0) scale(1.08) rotate(2deg); opacity: 1; }
    100% { transform: translate(0, 0) scale(1) rotate(0deg);    opacity: 1; }
  }
  .tile.merged-right { box-shadow: inset 0 -1px 0 var(--seam); }
  .tile.merged-down  { box-shadow: inset -1px 0 0 var(--seam); }
  .tile.merged-right.merged-down { box-shadow: none; }
  .tile.merge-flash { animation: mergeFlash 600ms ease-out; }
  @keyframes mergeFlash {
    0%   { filter: brightness(1); transform: scale(1); }
    25%  { filter: brightness(1.45) drop-shadow(0 0 12px rgba(255,199,60,0.95)); transform: scale(1.04); }
    100% { filter: brightness(1); transform: scale(1); }
  }
  .tile.pressing {
    transform: scale(1.03);
    z-index: 3;
    transition: transform 90ms ease-out;
  }
  .tile.dragging {
    z-index: 10;
    cursor: grabbing;
    box-shadow:
      inset -1px -1px 0 var(--seam),
      inset 1px 0 0 var(--seam),
      inset 0 1px 0 var(--seam),
      0 14px 28px rgba(0,0,0,0.45);
    filter: brightness(1.05);
  }
  .tile.drop-target {
    box-shadow: inset -1px -1px 0 var(--seam), inset 0 0 0 3px var(--gold);
  }
  .tile.hint-flash { animation: hintFlash 0.9s ease-in-out; }
  @keyframes hintFlash {
    0%, 100% { box-shadow: inset -1px -1px 0 var(--seam); }
    50% { box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px rgba(255,199,60,0.8); }
  }
  /* Near-solve hint: 1 tile away from done — flashes green. */
  .tile.near-solve-pulse { animation: nearSolvePulse 900ms ease-in-out; }
  @keyframes nearSolvePulse {
    0%, 100% { box-shadow: inset -1px -1px 0 var(--seam); filter: brightness(1); }
    50%      { box-shadow: inset 0 0 0 3px #6dd053, 0 0 18px rgba(109, 208, 83, 0.7); filter: brightness(1.15); }
  }
  /* First-moves assist: gold pulse on the tile to pick up. */
  .tile.assist-pickup {
    animation: assistPickup 1.2s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes assistPickup {
    0%, 100% { box-shadow: inset 0 0 0 3px var(--gold), 0 0 14px rgba(255,199,60,0.7);  filter: brightness(1.12); }
    50%      { box-shadow: inset 0 0 0 4px var(--gold), 0 0 26px rgba(255,199,60,1.0);  filter: brightness(1.30); }
  }
  /* First-moves assist: green pulse on the slot to drop into. */
  .tile.assist-drop {
    animation: assistDrop 1.2s ease-in-out infinite;
    z-index: 4;
  }
  @keyframes assistDrop {
    0%, 100% { box-shadow: inset 0 0 0 3px #6dd053; }
    50%      { box-shadow: inset 0 0 0 4px #6dd053, 0 0 22px rgba(109, 208, 83, 0.85); }
  }
  .tile.locked { pointer-events: none; }

  /* Tap-hint: animated hand + pulsing ring sitting over the pickup tile.
     Optionally travels to the drop tile (demo-move) for the first 2 moves. */
  .tap-hint {
    position: fixed;
    width: 60px; height: 60px;
    pointer-events: none;
    z-index: 41;
    opacity: 0;
    transition: opacity 220ms ease;
  }
  .tap-hint.shown { opacity: 1; }
  .tap-hint .hint-ring {
    position: absolute;
    inset: 0;
    border: 3px solid var(--gold);
    border-radius: 50%;
    animation: tapRing 1.4s ease-out infinite;
  }
  .tap-hint .hint-hand {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    animation: tapPulse 1.4s ease-in-out infinite;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }
  .tap-hint .hint-hand svg { width: 36px; height: 36px; }
  @keyframes tapPulse {
    0%, 100% { transform: scale(1) translateY(0); }
    35%      { transform: scale(0.86) translateY(3px); }
    55%      { transform: scale(0.86) translateY(3px); }
    75%      { transform: scale(1) translateY(0); }
  }
  @keyframes tapRing {
    0%   { transform: scale(0.65); opacity: 0.9; }
    100% { transform: scale(1.85); opacity: 0; }
  }
  .tap-hint.demo-move { animation: handTravel 2.4s ease-in-out infinite; }
  @keyframes handTravel {
    0%   { transform: translate(0, 0); opacity: 0; }
    7%   { transform: translate(0, 0); opacity: 1; }
    28%  { transform: translate(0, 0); opacity: 1; }
    62%  { transform: translate(var(--dx, 0), var(--dy, 0)); opacity: 1; }
    82%  { transform: translate(var(--dx, 0), var(--dy, 0)); opacity: 1; }
    92%  { transform: translate(var(--dx, 0), var(--dy, 0)); opacity: 0; }
    100% { transform: translate(0, 0); opacity: 0; }
  }
  .footer-bar {
    display: flex; justify-content: center; gap: 28px;
    padding: 14px 0 8px;
  }
  .tool {
    position: relative;
    width: 64px; height: 64px;
    background: #efe9ff;
    border-radius: 18px;
    border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    cursor: pointer;
    font-size: 30px;
  }
  .tool:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .tool.spent {
    opacity: 0.4;
    pointer-events: none;
    filter: grayscale(0.85);
  }
  .tool { color: #5849a3; }
  .tool-icon { width: 34px; height: 34px; display: block; }
  .badge {
    position: absolute;
    top: -6px; right: -6px;
    min-width: 22px; height: 22px;
    border-radius: 11px;
    background: #6B5BB7; color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
    padding: 0 5px;
  }
  .grid.won { animation: gridWinPulse 600ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes gridWinPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.06); filter: brightness(1.15) drop-shadow(0 0 30px rgba(255,199,60,0.8)); }
    100% { transform: scale(1); }
  }

  /* ═════════════════════════ WIN OVERLAY ═════════════════════════ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 50, 0.78);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 350ms ease;
    z-index: 40;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay-stars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bg-star {
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
  }
  .overlay-content {
    position: relative;
    width: 100%; max-width: 420px;
    padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    z-index: 2;
  }
  .ribbon-wrap {
    position: relative; width: 92%; max-width: 340px;
    height: 78px; margin-bottom: 14px;
  }
  .ribbon-tail {
    position: absolute; top: 22px;
    width: 56px; height: 50px;
    background: linear-gradient(180deg, #c14210, #8a2d08);
    z-index: 1;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
  }
  .ribbon-tail-left { left: -6px; clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 28% 50%); }
  .ribbon-tail-right { right: -6px; clip-path: polygon(0% 0%, 100% 0%, 72% 50%, 100% 100%, 0% 100%); }
  .ribbon-main {
    position: absolute; top: 0; left: 28px; right: 28px;
    height: 64px;
    background: linear-gradient(180deg, #ff944c, #e8541a);
    color: white;
    font-size: 22px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    text-shadow: 0 2px 0 rgba(120, 30, 0, 0.55);
    letter-spacing: 0.4px;
    z-index: 2;
    box-shadow:
      0 5px 0 rgba(0,0,0,0.18),
      inset 0 -3px 0 rgba(0,0,0,0.12),
      inset 0 2px 0 rgba(255,255,255,0.25);
  }
  .photo-frame {
    position: relative;
    width: 72%; max-width: 280px;
    aspect-ratio: 1 / 1;
    background: var(--puzzle-img) center/cover no-repeat;
    border: 6px solid #fff;
    border-radius: 10px;
    box-shadow:
      0 10px 0 rgba(0,0,0,0.22),
      0 0 0 1px rgba(0,0,0,0.05),
      0 0 30px rgba(255, 199, 60, 0.35);
    margin-bottom: 26px;
    transform: rotate(-3deg);  /* postcard tilt */
  }
  /* AIR MAIL stamp in the top-right corner of the photo-frame */
  .photo-stamp {
    position: absolute;
    top: 8px;
    right: -10px;
    background: #fff5e0;
    border: 2px dashed #c92c2c;
    color: #c92c2c;
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    transform: rotate(12deg);
    box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    line-height: 1;
  }
  .photo-stamp::before { content: '✈ '; }
  .coin-reward {
    position: absolute; bottom: -18px; left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 999px;
    padding: 4px 14px 4px 4px;
    display: flex; align-items: center; gap: 6px;
    font-weight: 900; color: #2c2452; font-size: 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
  }
  .coin-reward .coin { width: 26px; height: 26px; }
  .cta-continue {
    position: relative;
    overflow: hidden;
    width: 86%; max-width: 320px;
    padding: clamp(14px, 4.5vw, 18px);
    margin-top: 8px;
    display: block;
    background: linear-gradient(180deg, #6dd053, #36a02b);
    color: #fff;
    font-size: clamp(18px, 5.6vw, 24px);
    font-weight: 900;
    border: none;
    border-radius: 22px;
    box-shadow: 0 6px 0 #1d6d18, 0 12px 18px rgba(0,0,0,0.25);
    text-shadow: 0 2px 0 rgba(0, 60, 0, 0.35);
    cursor: pointer;
    letter-spacing: 0.6px;
  }
  .cta-continue:active { transform: translateY(3px); box-shadow: 0 3px 0 #1d6d18, 0 6px 10px rgba(0,0,0,0.25); }
  /* Diagonal shine sweep across the CTA every 2.6s. */
  .cta-continue::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -60%; width: 60%;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
    transform: translateX(0);
    pointer-events: none;
  }
  .overlay.show .cta-continue::before {
    animation: ctaShine 2.6s 1900ms ease-in-out infinite;
  }
  @keyframes ctaShine {
    0%, 25%   { transform: translateX(0);    opacity: 0; }
    35%       { opacity: 1; }
    65%       { opacity: 1; }
    75%, 100% { transform: translateX(360%); opacity: 0; }
  }

  .overlay .ribbon-wrap, .overlay .photo-frame, .overlay .cta-continue { opacity: 0; }
  .overlay .coin-reward { opacity: 0; transform: translateX(-50%) scale(0); }
  .overlay.show .ribbon-wrap { animation: ribbonDrop 600ms 0ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .overlay.show .photo-frame { animation: photoZoom 500ms 250ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .overlay.show .coin-reward { animation: badgePop 500ms 650ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .overlay.show .cta-continue {
    animation: ctaSlide 480ms 950ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
               ctaPulse 1500ms 1500ms ease-in-out infinite;
  }
  .overlay.show .bg-star { animation: starTwinkle 1400ms ease-in-out infinite; }
  @keyframes ribbonDrop {
    0%   { transform: translateY(-140px) rotate(-4deg); opacity: 0; }
    65%  { transform: translateY(8px) rotate(2deg);    opacity: 1; }
    100% { transform: translateY(0) rotate(0);          opacity: 1; }
  }
  @keyframes photoZoom {
    0%   { transform: scale(0.5)  rotate(-3deg);  opacity: 0; }
    70%  { transform: scale(1.06) rotate(-3deg);  opacity: 1; }
    100% { transform: scale(1)    rotate(-3deg);  opacity: 1; }
  }
  @keyframes badgePop {
    0%   { transform: translateX(-50%) scale(0);    opacity: 0; }
    70%  { transform: translateX(-50%) scale(1.25); opacity: 1; }
    100% { transform: translateX(-50%) scale(1);    opacity: 1; }
  }
  @keyframes ctaSlide {
    0%   { transform: translateY(70px) scale(0.85); opacity: 0; }
    60%  { transform: translateY(-6px) scale(1.08); opacity: 1; }
    100% { transform: translateY(0)    scale(1);    opacity: 1; }
  }
  @keyframes ctaPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: var(--star-base, 0.5); transform: var(--star-tf) scale(0.9); }
    50%      { opacity: calc(var(--star-base, 0.5) + 0.3); transform: var(--star-tf) scale(1.15); }
  }
  .sparkle {
    position: fixed;
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 25;
    animation: sparkleBurst 900ms ease-out forwards;
  }
  @keyframes sparkleBurst {
    0%   { transform: translate(0,0) scale(0.4); opacity: 1; }
    100% { transform: var(--end) scale(1.3);     opacity: 0; }
  }
  .confetti {
    position: fixed; top: -24px;
    width: 8px; height: 14px;
    border-radius: 2px;
    z-index: 25;
    pointer-events: none;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<!-- ═══════════ Loading screen ═══════════ -->
<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-title">PicMerge</div>
    <div class="loader-spinner"></div>
    <div class="loader-progress"><div class="loader-progress-fill" id="loaderProgressFill"></div></div>
    <div class="loader-text" id="loaderText">Loading 0%</div>
  </div>
</div>

<!-- ═══════════ Wheel screen ═══════════ -->
<div class="screen wheel-screen active" id="wheelScreen">
  <div class="clouds">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>
  <div class="wheel-inner">
    <div class="logo">
      <div class="logo-icon"></div>
      <div class="logo-text">PicMerge</div>
    </div>
    <div class="headline">WHERE TO<br>NEXT?</div>
    <div class="wheel-stage">
      <svg class="wheel-pointer" viewBox="0 0 44 40">
        <polygon points="22,40 4,4 40,4" fill="#c92c2c"/>
        <polygon points="22,36 8,6 36,6" fill="#ff6363"/>
        <polygon points="22,18 14,7 30,7" fill="#fff0a0" opacity="0.6"/>
      </svg>
      <div class="wheel-ring">
        <div class="wheel-lights" id="lightsRing"></div>
        <svg class="wheel-svg" viewBox="0 0 300 300" id="wheelSvg">
          <defs>
            <radialGradient id="hubGrad" cx="50%" cy="40%" r="60%">
              <stop offset="0%"  stop-color="#fff6c0"/>
              <stop offset="55%" stop-color="#ffc940"/>
              <stop offset="100%" stop-color="#c8861b"/>
            </radialGradient>
          </defs>
          <g id="wheelGroup">
            <path d="M 150 150 L 80.0 28.76 A 140 140 0 0 1 220.0 28.76 Z" fill="var(--paris)"/>
            <path d="M 150 150 L 220.0 28.76 A 140 140 0 0 1 290 150 Z" fill="var(--tokyo)"/>
            <path d="M 150 150 L 290 150 A 140 140 0 0 1 220.0 271.24 Z" fill="var(--rome)"/>
            <path d="M 150 150 L 220.0 271.24 A 140 140 0 0 1 80.0 271.24 Z" fill="var(--bali)"/>
            <path d="M 150 150 L 80.0 271.24 A 140 140 0 0 1 10 150 Z" fill="var(--nyc)"/>
            <path d="M 150 150 L 10 150 A 140 140 0 0 1 80.0 28.76 Z" fill="var(--marrakech)"/>
            <g stroke="rgba(255,255,255,0.85)" stroke-width="2.5" fill="none">
              <line x1="150" y1="150" x2="220.0" y2="28.76"/>
              <line x1="150" y1="150" x2="290" y2="150"/>
              <line x1="150" y1="150" x2="220.0" y2="271.24"/>
              <line x1="150" y1="150" x2="80.0" y2="271.24"/>
              <line x1="150" y1="150" x2="10" y2="150"/>
              <line x1="150" y1="150" x2="80.0" y2="28.76"/>
            </g>
            <!-- Each wedge: icon at radius 78 (just outside the r=55 hub),
                 label at radius 100 (further toward the outer rim where the
                 wedge is widest). Both centered on the wedge's bisector. -->
            <text class="wedge-label" x="150" y="50">PARIS</text>
            <text class="wedge-icon"  x="150" y="80">🗼</text>
            <text class="wedge-label" x="237" y="100">TOKYO</text>
            <text class="wedge-icon"  x="218" y="115">🌸</text>
            <text class="wedge-label" x="237" y="205">ROME</text>
            <text class="wedge-icon"  x="218" y="193">🏛️</text>
            <text class="wedge-label" x="150" y="255">BALI</text>
            <text class="wedge-icon"  x="150" y="225">🏝️</text>
            <text class="wedge-label" x="63"  y="205">NYC</text>
            <text class="wedge-icon"  x="82"  y="193">🌆</text>
            <text class="wedge-label" x="63"  y="100">MARRAKECH</text>
            <text class="wedge-icon"  x="82"  y="115">🕌</text>
          </g>
        </svg>
        <svg class="hub-wrap" viewBox="0 0 300 300"
             style="position:absolute; inset:11px; width:calc(100% - 22px); height:calc(100% - 22px); pointer-events:none;">
          <g class="hub-pulse" id="hubPulse">
            <circle class="hub-glow" cx="150" cy="150" r="55" stroke="#fff" stroke-width="4"/>
            <circle cx="150" cy="150" r="55" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="2"/>
            <text class="hub-text" x="150" y="158" font-size="26">SPIN!</text>
          </g>
          <circle class="hub-button" id="spinBtn" cx="150" cy="150" r="55" style="pointer-events:auto;"/>
        </svg>
        <svg class="charge-ring" viewBox="0 0 300 300" id="chargeRing">
          <defs>
            <linearGradient id="chargeGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"  stop-color="#fff6c0"/>
              <stop offset="100%" stop-color="#ffb000"/>
            </linearGradient>
          </defs>
          <!-- Track (faint) -->
          <circle cx="150" cy="150" r="68" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8"/>
          <!-- Fill arc — dashoffset animates from 427 (empty) to 0 (full) -->
          <circle id="chargeArc" cx="150" cy="150" r="68"
                  stroke-dasharray="427" stroke-dashoffset="427"/>
        </svg>
      </div>
      <div class="deco deco-plane">✈</div>
      <div class="deco deco-case">🧳</div>
      <div class="deco deco-card">📮</div>
    </div>
    <div class="deco-coin coin-1"></div>
    <div class="deco-coin coin-2"></div>
    <div class="deco-coin coin-3"></div>
    <div class="deco-coin coin-4"></div>
  </div>
</div>

<!-- ═══════════ Reveal card (transient, above wheel) ═══════════ -->
<div class="reveal-card" id="revealCard">
  <div class="reveal-flash"></div>
  <div class="reveal-stamp">
    <div class="reveal-stamp-line1">PARIS</div>
    <div class="reveal-stamp-line2">PAR AVION</div>
  </div>
  <div>
    <div class="reveal-icon" id="revealIcon">🗼</div>
    <div class="reveal-city" id="revealCity">PARIS!</div>
    <div class="reveal-tag">Postcard unlocked — solve it!</div>
  </div>
</div>

<!-- ═══════════ Puzzle screen ═══════════ -->
<div class="screen puzzle-screen" id="puzzleScreen">
  <div class="puzzle-inner">
    <div class="play-area">
      <div class="p-header">
        <div class="challenge-text">
          99% of players<span class="big">FAIL THIS LEVEL</span>
        </div>
      </div>
      <div class="stage">
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="footer-bar">
      <button class="tool" id="hintBtn" aria-label="Hint">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>
        </svg>
        <span class="badge">3</span>
      </button>
      <button class="tool" id="undoBtn" aria-label="Undo">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
        </svg>
        <span class="badge">3</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════ Tap hint (for first-moves assist) ═══════════ -->
<div class="tap-hint" id="tapHint" aria-hidden="true">
  <div class="hint-ring"></div>
  <div class="hint-hand">
    <svg viewBox="0 0 24 24" fill="white">
      <path d="M9 11.5V5a2 2 0 1 1 4 0v6.5l1-1a2 2 0 1 1 2.83 2.83l-1 1a2 2 0 1 1 2.83 2.83l-1 1A6 6 0 0 1 6 14V6.5a1.5 1.5 0 1 1 3 0V11.5z"/>
    </svg>
  </div>
</div>

<!-- ═══════════ Win overlay ═══════════ -->
<div class="overlay" id="winOverlay">
  <div class="overlay-stars" id="overlayStars"></div>
  <div class="overlay-content">
    <div class="ribbon-wrap">
      <div class="ribbon-tail ribbon-tail-left"></div>
      <div class="ribbon-tail ribbon-tail-right"></div>
      <div class="ribbon-main">Postcard Saved!</div>
    </div>
    <div class="photo-frame">
      <div class="photo-stamp">AIR MAIL</div>
      <div class="coin-reward">
        <span class="coin">$</span><span>+<span id="coinCount">0</span></span>
      </div>
    </div>
    <button class="cta-continue" id="ctaBtn">UNLOCK 100+ CITIES</button>
  </div>
</div>

<script>
(() => {
  // ──────────────────────────────────────────────────────────────
  //  Audio module (procedural SFX + ambient pad)
  // ──────────────────────────────────────────────────────────────
  const audio = (() => {
    let ctx = null, master = null, sfxBus = null, musicBus = null;
    let muted = false, musicStarted = false;
    const prevMute = 0.7;
    function ensureCtx() {
      if (ctx) return ctx;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();  master.gain.value = 0.7; master.connect(ctx.destination);
        sfxBus = ctx.createGain();  sfxBus.gain.value = 1.0; sfxBus.connect(master);
        musicBus = ctx.createGain(); musicBus.gain.value = 0.22; musicBus.connect(master);
      } catch (e) {}
      return ctx;
    }
    function unlock() {
      ensureCtx();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      // Background music intentionally disabled — SFX-only for now.
      // if (!musicStarted && ctx) { startMusic(); musicStarted = true; }
    }
    // No-op when music is disabled; kept on the public API for future re-enable.
    function duckMusic() {}
    function tone(freq, dur, { type = 'sine', attack = 0.005, gain = 0.25, bus = sfxBus } = {}) {
      if (!ctx || muted) return;
      const osc = ctx.createOscillator(), env = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      env.gain.value = 0;
      osc.connect(env); env.connect(bus);
      const t = ctx.currentTime;
      env.gain.linearRampToValueAtTime(gain, t + attack);
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    function playPickup() { tone(660, 0.06, { type: 'triangle', gain: 0.14 }); }
    function playDrop()   { tone(330, 0.09, { type: 'triangle', gain: 0.12 }); }
    function playMerge() {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) =>
        setTimeout(() => tone(f, 0.32, { type: 'triangle', gain: 0.22 }), i * 55));
    }
    function playWin() {
      [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) =>
        setTimeout(() => tone(f, 0.45, { type: 'triangle', gain: 0.3 }), i * 110));
    }
    function playSpinTick() { tone(1200, 0.03, { type: 'square', gain: 0.07 }); }
    function playReveal() {
      [659.25, 783.99, 987.77, 1318.51].forEach((f, i) =>
        setTimeout(() => tone(f, 0.4, { type: 'triangle', gain: 0.25 }), i * 90));
    }
    // Rising whoosh during the spin button hold; pitch sweeps upward over
    // ~1.2s to match the charge gauge filling.
    function playCharge() {
      if (!ctx || muted) return;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 110;
      env.gain.value = 0;
      osc.connect(env); env.connect(sfxBus);
      const t = ctx.currentTime;
      env.gain.linearRampToValueAtTime(0.10, t + 0.04);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 1.25);
      osc.frequency.exponentialRampToValueAtTime(620, t + 1.2);
      osc.start(t); osc.stop(t + 1.3);
    }
    // Wheel lands: deep thud + bright chime layered.
    function playLand() {
      tone(80,      0.18, { type: 'sine',     gain: 0.28, attack: 0.002 });
      tone(140,     0.12, { type: 'triangle', gain: 0.18, attack: 0.002 });
      setTimeout(() => tone(1318.51, 0.22, { type: 'triangle', gain: 0.26 }), 70);
      setTimeout(() => tone(1760,    0.18, { type: 'triangle', gain: 0.20 }), 150);
    }
    // CTA reveal: rising whoosh + sparkle ding when the Play button arrives.
    function playCtaReveal() {
      if (!ctx || muted) return;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 320;
      env.gain.value = 0;
      osc.connect(env); env.connect(sfxBus);
      const t = ctx.currentTime;
      env.gain.linearRampToValueAtTime(0.18, t + 0.04);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      osc.frequency.exponentialRampToValueAtTime(900, t + 0.32);
      osc.start(t); osc.stop(t + 0.36);
      setTimeout(() => tone(1318.51, 0.22, { type: 'triangle', gain: 0.22 }), 120);
      setTimeout(() => tone(1760,    0.18, { type: 'triangle', gain: 0.18 }), 220);
    }
    // Soft tick for the coin count-up animation.
    function playCount() { tone(880, 0.04, { type: 'square', gain: 0.06 }); }
    function startMusic() {
      if (!ctx) return;
      const chords = [
        [261.63, 329.63, 392.00],
        [220.00, 261.63, 329.63],
        [174.61, 220.00, 261.63],
        [196.00, 246.94, 293.66],
      ];
      const beatDur = 3.6;
      const pad = [];
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const filt = ctx.createBiquadFilter();
        const env = ctx.createGain();
        osc.type = 'sawtooth';
        osc.detune.value = (i - 1) * 6;
        osc.frequency.value = chords[0][i];
        filt.type = 'lowpass'; filt.frequency.value = 900; filt.Q.value = 1;
        env.gain.value = 0;
        osc.connect(filt); filt.connect(env); env.connect(musicBus);
        osc.start();
        pad.push({ osc, env });
      }
      let beat = 0;
      function nextChord() {
        const chord = chords[beat % chords.length];
        const t = ctx.currentTime;
        pad.forEach((p, i) => {
          p.osc.frequency.linearRampToValueAtTime(chord[i], t + 0.6);
          if (beat === 0) p.env.gain.linearRampToValueAtTime(0.055, t + 1.5);
        });
        beat++;
      }
      nextChord();
      setInterval(nextChord, beatDur * 1000);
    }
    function setMuted(m) {
      muted = m;
      ensureCtx();
      if (master) {
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.linearRampToValueAtTime(m ? 0 : prevMute, t + 0.15);
      }
    }
    function isMuted() { return muted; }
    return { unlock, playPickup, playDrop, playMerge, playWin, playSpinTick, playReveal, playCharge, playLand, playCtaReveal, playCount, duckMusic, setMuted, isMuted };
  })();

  // Audio still needs unlocking on first gesture (procedural SFX use Web Audio).
  document.addEventListener('pointerdown', () => audio.unlock(), { once: true });

  // ──────────────────────────────────────────────────────────────
  //  Wheel
  // ──────────────────────────────────────────────────────────────
  const wheelSvg = document.getElementById('wheelSvg');
  const spinBtn = document.getElementById('spinBtn');
  const lightsRing = document.getElementById('lightsRing');
  const hubPulse = document.getElementById('hubPulse');
  const revealCard = document.getElementById('revealCard');
  const revealCity = document.getElementById('revealCity');
  const revealIcon = document.getElementById('revealIcon');
  const wheelScreen = document.getElementById('wheelScreen');
  const puzzleScreen = document.getElementById('puzzleScreen');

  const CITIES = [
    { name: 'PARIS',     icon: '🗼' },
    { name: 'TOKYO',     icon: '🌸' },
    { name: 'ROME',      icon: '🏛️' },
    { name: 'BALI',      icon: '🏝️' },
    { name: 'NYC',       icon: '🌆' },
    { name: 'MARRAKECH', icon: '🕌' },
  ];
  const TARGET = 0; // Paris

  // 16 blinking bulbs around the rim
  const NUM_LIGHTS = 16;
  for (let i = 0; i < NUM_LIGHTS; i++) {
    const a = (i / NUM_LIGHTS) * 2 * Math.PI;
    const el = document.createElement('div');
    el.className = 'light';
    el.style.left  = `calc(50% + ${Math.cos(a) * 49}%)`;
    el.style.top   = `calc(50% + ${Math.sin(a) * 49}%)`;
    el.style.transform = `translate(-50%, -50%)`;
    el.style.animationDelay = (i * 75) + 'ms';
    lightsRing.appendChild(el);
  }

  let spinning = false;

  // ─── HOLD-TO-CHARGE SPIN ───
  // pointerdown → start filling the charge gauge; pointerup → spin with
  // power proportional to how long they held. Tap-only still spins.
  const chargeRing = document.getElementById('chargeRing');
  const chargeArc  = document.getElementById('chargeArc');
  const CHARGE_CIRCUMFERENCE = 427;   // 2π · r where r = 68
  const MAX_HOLD_MS = 1200;
  const MIN_ROTATIONS = 3;
  const MAX_ROTATIONS = 6;

  let chargeStart = 0;
  let chargeRaf   = null;
  let charging    = false;

  function updateChargeArc() {
    const held = Math.min(MAX_HOLD_MS, performance.now() - chargeStart);
    const t = held / MAX_HOLD_MS;
    chargeArc.style.strokeDashoffset = CHARGE_CIRCUMFERENCE * (1 - t);
    if (charging) chargeRaf = requestAnimationFrame(updateChargeArc);
  }

  function beginCharge(e) {
    if (spinning || charging) return;
    e.preventDefault();
    charging = true;
    chargeStart = performance.now();
    audio.unlock();
    chargeRing.classList.add('active');
    wheelSvg.classList.add('charging');
    chargeArc.style.strokeDashoffset = CHARGE_CIRCUMFERENCE;  // reset to empty
    chargeRaf = requestAnimationFrame(updateChargeArc);
    audio.playCharge && audio.playCharge();
  }

  function releaseCharge() {
    if (!charging) return;
    charging = false;
    if (chargeRaf) { cancelAnimationFrame(chargeRaf); chargeRaf = null; }
    chargeRing.classList.remove('active');
    wheelSvg.classList.remove('charging');
    const held = Math.min(MAX_HOLD_MS, performance.now() - chargeStart);
    const level = held / MAX_HOLD_MS;  // 0..1
    spin(level);
  }

  function spin(chargeLevel) {
    if (spinning) return;
    spinning = true;
    hubPulse.classList.add('stopped');

    // Rotations must be an INTEGER so the wheel ends on a whole turn —
    // a fractional count (e.g. 4.5) lands 180° off-target, putting Bali
    // under the pointer instead of Paris.
    const rotations = Math.floor(MIN_ROTATIONS + (MAX_ROTATIONS - MIN_ROTATIONS) * chargeLevel);
    const spinMs    = 3200 + 1500 * chargeLevel;  // longer with more charge
    const wedgeDeg  = 60;
    // Jitter stays well inside Paris's 60° wedge (±7° from center).
    const jitter    = (Math.random() * 14 - 7);
    const finalDeg  = rotations * 360 + (-TARGET * wedgeDeg) + jitter;

    // Hard-reset to rotate(0) instantly so the transition has a clean start.
    // (Removing .charging mid-animation can leave a fuzzy computed transform
    //  that the new transition would interpolate FROM, not from zero.)
    wheelSvg.style.transition = 'none';
    wheelSvg.style.transform  = 'rotate(0deg)';
    // Force browser to commit the reset before applying the spin transition.
    void wheelSvg.offsetWidth;
    wheelSvg.style.transition = `transform ${spinMs}ms cubic-bezier(0.18, 0.62, 0.18, 1)`;
    // Apply target on the next frame so the transition reliably activates.
    requestAnimationFrame(() => {
      wheelSvg.style.transform = `rotate(${finalDeg}deg)`;
    });

    // Tick cadence scales with charge — beefier spin = denser ticks early.
    const tickStart = performance.now();
    function scheduleTick() {
      const elapsed = performance.now() - tickStart;
      if (elapsed >= spinMs) return;
      audio.playSpinTick();
      const t = elapsed / spinMs;
      const delay = 36 + t * t * (320 - 80 * chargeLevel);
      setTimeout(scheduleTick, delay);
    }
    scheduleTick();

    // Landing — fires when the spin transition completes. Bundle all the
    // drama: screen shake + hub flash + lights bright pulse + golden burst
    // at the pointer, then a beat later trigger the reveal card.
    setTimeout(() => {
      landingDrama(chargeLevel);
      setTimeout(() => {
        const city = CITIES[TARGET];
        revealCity.textContent = city.name + '!';
        revealIcon.textContent = city.icon;
        revealCard.classList.add('show');
        audio.playReveal();
        // Burst particles at the city text's settle point (~200ms in).
        setTimeout(() => burstAtElement(revealCity, 20), 260);
        setTimeout(() => {
          revealCard.classList.remove('show');
          wheelScreen.classList.remove('active');
          puzzleScreen.classList.add('active');
          startPuzzle();
        }, 1800);
      }, 380);
    }, spinMs + 80);
  }

  // Generic sparkle burst centered on a DOM element. Used for both the
  // wheel landing and the reveal-card city explosion.
  function burstAtElement(el, count) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top  + r.height / 2;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const dist = 90 + Math.random() * 80;
      s.style.left = (cx - 5) + 'px';
      s.style.top  = (cy - 5) + 'px';
      s.style.width = '10px';
      s.style.height = '10px';
      s.style.background = i % 3 === 0 ? '#fff4c5' : '#ffd24c';
      s.style.setProperty('--end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  // Particle burst at the wheel pointer when the wheel lands.
  function landingDrama(chargeLevel) {
    audio.playLand();
    wheelScreen.classList.remove('shake');
    void wheelScreen.offsetWidth;
    wheelScreen.classList.add('shake');
    setTimeout(() => wheelScreen.classList.remove('shake'), 280);

    hubPulse.classList.remove('landed');
    void hubPulse.offsetWidth;
    hubPulse.classList.add('landed');

    lightsRing.classList.remove('landed');
    void lightsRing.offsetWidth;
    lightsRing.classList.add('landed');
    setTimeout(() => lightsRing.classList.remove('landed'), 520);

    // Golden + cream particle burst at the wheel pointer (top of wheel).
    const pointerRect = document.querySelector('.wheel-pointer').getBoundingClientRect();
    const cx = pointerRect.left + pointerRect.width / 2;
    const cy = pointerRect.top + pointerRect.height;  // tip of pointer
    const count = 16 + Math.round(chargeLevel * 12);
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
      const dist = 70 + Math.random() * (90 + chargeLevel * 60);
      s.style.left = (cx - 5) + 'px';
      s.style.top  = (cy - 5) + 'px';
      s.style.width = '10px';
      s.style.height = '10px';
      s.style.background = i % 3 === 0 ? '#fff4c5' : '#ffd24c';
      s.style.setProperty('--end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  spinBtn.addEventListener('pointerdown', beginCharge);
  spinBtn.addEventListener('pointerup', releaseCharge);
  spinBtn.addEventListener('pointercancel', releaseCharge);
  spinBtn.addEventListener('pointerleave', releaseCharge);

  // ──────────────────────────────────────────────────────────────
  //  Puzzle game
  // ──────────────────────────────────────────────────────────────
  const GRID = 3;
  const TOTAL = GRID * GRID;
  const grid = document.getElementById('grid');
  const winOverlay = document.getElementById('winOverlay');
  const hintBtn = document.getElementById('hintBtn');
  const undoBtn = document.getElementById('undoBtn');
  const ctaBtn = document.getElementById('ctaBtn');
  const overlayStars = document.getElementById('overlayStars');
  const tapHint = document.getElementById('tapHint');

  let tiles = [];
  let history = [];
  let solved = false;
  let animating = false;
  let prevMergeKeys = new Set();
  let suppressMergeFx = false;
  let puzzleStarted = false;
  let hintsLeft = 3;
  let undosLeft = 3;
  let assistMovesLeft = 3;
  let lastPickSlot = -1;
  const HINTS_START = 3;
  const UNDOS_START = 3;
  const DRAG_THRESHOLD = 6;
  const hintBadge = hintBtn.querySelector('.badge');
  const undoBadge = undoBtn.querySelector('.badge');

  function updateToolBadges() {
    hintBadge.textContent = hintsLeft;
    undoBadge.textContent = undosLeft;
    hintBtn.classList.toggle('spent', hintsLeft <= 0);
    undoBtn.classList.toggle('spent', undosLeft <= 0);
  }

  // ── Assist: pulses on which tile to pick & where to drop (first 3 moves) ──
  function positionHintOnTile(el) {
    if (!el || !tapHint) return;
    const r = el.getBoundingClientRect();
    tapHint.style.left = (r.left + r.width / 2 - 30) + 'px';
    tapHint.style.top  = (r.top  + r.height / 2 - 30) + 'px';
  }
  function showHint() { if (tapHint) tapHint.classList.add('shown'); }
  function hideHint() {
    if (!tapHint) return;
    tapHint.classList.remove('shown', 'demo-move');
  }
  function clearAssistClasses() {
    grid.querySelectorAll('.tile.assist-pickup, .tile.assist-drop').forEach(t => {
      t.classList.remove('assist-pickup', 'assist-drop');
    });
  }
  function applyAssist() {
    clearAssistClasses();
    if (assistMovesLeft <= 0 || solved) {
      hideHint();
      lastPickSlot = -1;
      return;
    }
    // Gather misplaced slots; prefer a 2-cycle (cleanest swap demo).
    const wrongSlots = [];
    for (let i = 0; i < TOTAL; i++) if (tiles[i] !== i) wrongSlots.push(i);
    if (wrongSlots.length === 0) {
      hideHint();
      lastPickSlot = -1;
      return;
    }
    let pickSlot = wrongSlots[0];
    for (const s of wrongSlots) {
      const dest = tiles[s];
      if (tiles[dest] === s) { pickSlot = s; break; }
    }
    const dropSlot = tiles[pickSlot];
    const pickEl = getTileEl(pickSlot);
    const dropEl = getTileEl(dropSlot);
    if (pickEl) pickEl.classList.add('assist-pickup');
    if (dropEl) dropEl.classList.add('assist-drop');
    lastPickSlot = pickSlot;
    if (pickEl) {
      positionHintOnTile(pickEl);
      if (tapHint) {
        tapHint.classList.remove('demo-move');
        // First 2 assists: hand travels from pickup → drop to demonstrate.
        if (assistMovesLeft >= 2 && dropEl) {
          const r1 = pickEl.getBoundingClientRect();
          const r2 = dropEl.getBoundingClientRect();
          const dx = (r2.left + r2.width / 2) - (r1.left + r1.width / 2);
          const dy = (r2.top + r2.height / 2) - (r1.top + r1.height / 2);
          tapHint.style.setProperty('--dx', dx + 'px');
          tapHint.style.setProperty('--dy', dy + 'px');
          void tapHint.offsetWidth;
          tapHint.classList.add('demo-move');
        }
      }
      showHint();
    }
  }
  window.addEventListener('resize', () => {
    if (lastPickSlot < 0) return;
    applyAssist();
  });

  function bgPositionFor(c) {
    const col = c % GRID, row = Math.floor(c / GRID);
    const step = 100 / (GRID - 1);
    return `${col * step}% ${row * step}%`;
  }
  function render() {
    grid.innerHTML = '';
    tiles.forEach((c, slot) => {
      const t = document.createElement('div');
      t.className = 'tile';
      t.dataset.slot = slot;
      t.style.backgroundPosition = bgPositionFor(c);
      attachDrag(t);
      grid.appendChild(t);
    });
    updateMergeState();
  }
  function shuffle() {
    do {
      tiles = Array.from({ length: TOTAL }, (_, i) => i);
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
      }
    } while (isSolved());
  }
  function isSolved() { return tiles.every((c, i) => c === i); }
  function getTileEl(slot) { return grid.querySelector(`.tile[data-slot="${slot}"]`); }

  function updateMergeState() {
    const newKeys = new Set();
    const newPairs = [];
    for (let slot = 0; slot < TOTAL; slot++) {
      const el = getTileEl(slot);
      if (!el) continue;
      el.classList.remove('merged-right', 'merged-down');
      const c = tiles[slot];
      const row = Math.floor(slot / GRID), col = slot % GRID;
      if (col < GRID - 1 && (c % GRID) < GRID - 1 && tiles[slot + 1] === c + 1) {
        el.classList.add('merged-right');
        const k = `H${c}`; newKeys.add(k);
        if (!prevMergeKeys.has(k)) newPairs.push({ a: slot, b: slot + 1, dir: 'R' });
      }
      if (row < GRID - 1 && c < TOTAL - GRID && tiles[slot + GRID] === c + GRID) {
        el.classList.add('merged-down');
        const k = `V${c}`; newKeys.add(k);
        if (!prevMergeKeys.has(k)) newPairs.push({ a: slot, b: slot + GRID, dir: 'D' });
      }
    }
    prevMergeKeys = newKeys;
    if (newPairs.length && !suppressMergeFx) onMerge(newPairs);
  }
  function getGroup(slot) {
    const visited = new Set([slot]);
    const queue = [slot];
    while (queue.length) {
      const s = queue.shift();
      const el = getTileEl(s);
      if (!el) continue;
      const row = Math.floor(s / GRID), col = s % GRID;
      if (el.classList.contains('merged-right') && col < GRID - 1 && !visited.has(s + 1)) { visited.add(s + 1); queue.push(s + 1); }
      if (col > 0) {
        const left = getTileEl(s - 1);
        if (left && left.classList.contains('merged-right') && !visited.has(s - 1)) { visited.add(s - 1); queue.push(s - 1); }
      }
      if (el.classList.contains('merged-down') && row < GRID - 1 && !visited.has(s + GRID)) { visited.add(s + GRID); queue.push(s + GRID); }
      if (row > 0) {
        const up = getTileEl(s - GRID);
        if (up && up.classList.contains('merged-down') && !visited.has(s - GRID)) { visited.add(s - GRID); queue.push(s - GRID); }
      }
    }
    return [...visited];
  }
  function onMerge(pairs) {
    audio.playMerge();
    pairs.forEach(({ a, b, dir }) => {
      const ea = getTileEl(a), eb = getTileEl(b);
      if (!ea || !eb) return;
      [ea, eb].forEach(el => {
        el.classList.remove('merge-flash');
        void el.offsetWidth;
        el.classList.add('merge-flash');
        setTimeout(() => el.classList.remove('merge-flash'), 650);
      });
      sparkleSeam(ea, eb, dir);
    });
  }
  function sparkleSeam(elA, elB, dir) {
    const rA = elA.getBoundingClientRect();
    const rB = elB.getBoundingClientRect();
    const cx = dir === 'R' ? (rA.right + rB.left) / 2 : (rA.left + rA.right) / 2;
    const cy = dir === 'R' ? (rA.top + rA.bottom) / 2 : (rA.bottom + rB.top) / 2;
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (i / 12) * Math.PI * 2 + Math.random() * 0.4;
      const dist = 28 + Math.random() * 36;
      s.style.left = (cx - 5) + 'px';
      s.style.top = (cy - 5) + 'px';
      s.style.width = '8px'; s.style.height = '8px';
      s.style.setProperty('--end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
      s.style.background = i % 2 ? '#FFC73C' : '#fff';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }
  function attachDrag(el) {
    let pid = null, startX = 0, startY = 0, dragging = false;
    let groupSlots = null, groupEls = null, anchorSlot = null;
    el.addEventListener('pointerdown', (e) => {
      audio.unlock();
      if (solved || animating || pid !== null) return;
      pid = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      dragging = false;
      anchorSlot = +el.dataset.slot;
      try { el.setPointerCapture(pid); } catch (_) {}
      el.classList.add('pressing');
      audio.playPickup();
      // Hide assist hand + clear pulse classes so drag visuals win.
      hideHint();
      clearAssistClasses();
    });
    el.addEventListener('pointermove', (e) => {
      if (e.pointerId !== pid) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        dragging = true;
        el.classList.remove('pressing');
        groupSlots = getGroup(anchorSlot);
        groupEls = groupSlots.map(s => ({ slot: s, el: getTileEl(s) }));
        groupEls.forEach(g => g.el.classList.add('dragging'));
      }
      const k = 0.06;
      const tileW = el.offsetWidth;
      const anchorCol = anchorSlot % GRID;
      const anchorRow = (anchorSlot - anchorCol) / GRID;
      groupEls.forEach(g => {
        const relCol = (g.slot % GRID) - anchorCol;
        const relRow = Math.floor(g.slot / GRID) - anchorRow;
        const sx = k * relCol * tileW;
        const sy = k * relRow * tileW;
        g.el.style.transform = `translate(${dx + sx}px, ${dy + sy}px) scale(${1 + k})`;
      });
      groupEls.forEach(g => { g.el.style.pointerEvents = 'none'; });
      const over = document.elementFromPoint(e.clientX, e.clientY);
      groupEls.forEach(g => { g.el.style.pointerEvents = ''; });
      grid.querySelectorAll('.tile.drop-target').forEach(t => { if (t !== over) t.classList.remove('drop-target'); });
      if (over && over.classList && over.classList.contains('tile')) {
        const ts = +over.dataset.slot;
        if (!groupSlots.includes(ts)) over.classList.add('drop-target');
      }
    });
    const finish = (e) => {
      if (e.pointerId !== pid) return;
      pid = null;
      if (!dragging) { el.classList.remove('pressing'); return; }
      grid.querySelectorAll('.tile.drop-target').forEach(t => t.classList.remove('drop-target'));
      groupEls.forEach(g => { g.el.style.pointerEvents = 'none'; });
      const over = document.elementFromPoint(e.clientX, e.clientY);
      groupEls.forEach(g => { g.el.style.pointerEvents = ''; });
      let targetAnchorSlot = null;
      if (over && over.classList && over.classList.contains('tile')) {
        const ts = +over.dataset.slot;
        if (!groupSlots.includes(ts)) targetAnchorSlot = ts;
      }
      if (targetAnchorSlot === null) { snapGroupBack(groupEls); groupSlots = null; groupEls = null; return; }
      const dRow = Math.floor(targetAnchorSlot / GRID) - Math.floor(anchorSlot / GRID);
      const dCol = (targetAnchorSlot % GRID) - (anchorSlot % GRID);
      let valid = true;
      const newSlots = groupEls.map(g => {
        const r = Math.floor(g.slot / GRID) + dRow;
        const c = (g.slot % GRID) + dCol;
        if (r < 0 || r >= GRID || c < 0 || c >= GRID) { valid = false; return -1; }
        return r * GRID + c;
      });
      if (!valid) { snapGroupBack(groupEls); groupSlots = null; groupEls = null; return; }
      audio.playDrop();
      performMove(groupEls, newSlots, e.clientX - startX, e.clientY - startY);
      groupSlots = null; groupEls = null;
    };
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
    el.addEventListener('lostpointercapture', finish);
  }
  function snapGroupBack(groupEls) {
    groupEls.forEach(g => {
      g.el.classList.remove('dragging');
      g.el.style.transition = 'transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1)';
      g.el.style.transform = 'translate(0, 0) scale(1)';
    });
    setTimeout(() => {
      groupEls.forEach(g => { g.el.style.transition = ''; g.el.style.transform = ''; });
    }, 240);
  }
  function performMove(groupEls, newSlots, dragDx, dragDy) {
    if (animating) return;
    animating = true;
    pushHistory();
    const oldSlots = groupEls.map(g => g.slot);
    const oldSet = new Set(oldSlots), newSet = new Set(newSlots);
    const displaced = newSlots.filter(s => !oldSet.has(s)).sort((a,b) => a-b);
    const vacated  = oldSlots.filter(s => !newSet.has(s)).sort((a,b) => a-b);
    const gridRect = grid.getBoundingClientRect();
    const rects = {};
    for (let s = 0; s < TOTAL; s++) {
      const el2 = getTileEl(s);
      rects[s] = { left: gridRect.left + el2.offsetLeft, top: gridRect.top + el2.offsetTop };
    }
    groupEls.forEach((g, i) => {
      const tx = rects[newSlots[i]].left - rects[g.slot].left;
      const ty = rects[newSlots[i]].top  - rects[g.slot].top;
      g.el.style.transition = 'transform 240ms cubic-bezier(0.4, 0, 0.2, 1)';
      g.el.style.transform = `translate(${tx}px, ${ty}px) scale(1)`;
      g.el.style.zIndex = '4';
    });
    displaced.forEach((fromS, i) => {
      const toS = vacated[i];
      const el2 = getTileEl(fromS);
      const tx = rects[toS].left - rects[fromS].left;
      const ty = rects[toS].top  - rects[fromS].top;
      el2.style.transition = 'transform 240ms cubic-bezier(0.4, 0, 0.2, 1)';
      el2.style.transform = `translate(${tx}px, ${ty}px)`;
    });
    setTimeout(() => {
      const groupArt = oldSlots.map(s => tiles[s]);
      const displacedArt = displaced.map(s => tiles[s]);
      const next = [...tiles];
      groupEls.forEach((g, i) => { next[newSlots[i]] = groupArt[i]; });
      displaced.forEach((_, i) => { next[vacated[i]] = displacedArt[i]; });
      tiles = next;
      const touched = new Set([...oldSlots, ...newSlots, ...displaced, ...vacated]);
      touched.forEach(s => {
        const el2 = getTileEl(s);
        el2.classList.remove('dragging');
        el2.style.transition = 'none';
        el2.style.transform = '';
        el2.style.zIndex = '';
        el2.style.backgroundPosition = bgPositionFor(tiles[s]);
      });
      void grid.offsetWidth;
      touched.forEach(s => { getTileEl(s).style.transition = ''; });
      updateMergeState();
      // Near-solve: if only 1 tile is misplaced, flash it + its target green.
      const wrongCount = tiles.reduce((acc, c, i) => acc + (c !== i ? 1 : 0), 0);
      if (wrongCount === 1) {
        const wrongSlot = tiles.findIndex((c, i) => c !== i);
        const a = getTileEl(wrongSlot);
        const b = getTileEl(tiles[wrongSlot]);
        [a, b].forEach(t => {
          if (!t) return;
          t.classList.remove('near-solve-pulse');
          void t.offsetWidth;
          t.classList.add('near-solve-pulse');
          setTimeout(() => t.classList.remove('near-solve-pulse'), 900);
        });
      }
      // Decrement the assist budget and re-apply on next-best move.
      assistMovesLeft = Math.max(0, assistMovesLeft - 1);
      applyAssist();
      animating = false;
      if (isSolved()) handleWin();
    }, 240);
  }
  function pushHistory() { history.push([...tiles]); if (history.length > 20) history.shift(); }

  function handleWin() {
    solved = true;
    grid.querySelectorAll('.tile').forEach(t => t.classList.add('locked'));
    hideHint();
    clearAssistClasses();
    audio.playWin();
    grid.classList.add('won');
    burstSparkles();
    startConfetti(48);
    spawnOverlayStars(28);
    setTimeout(() => {
      winOverlay.classList.add('show');
      // Coin count-up timed to the badgePop entry (overlay+650ms cascade slot)
      setTimeout(() => animateCoinCount(50, 700), 650);
      // CTA reveal SFX timed to its slide-in (overlay+950ms)
      setTimeout(() => audio.playCtaReveal(), 950);
    }, 650);
  }
  // Tick the visible coin count up to `target` over `duration` ms.
  function animateCoinCount(target, duration) {
    const el = document.getElementById('coinCount');
    if (!el) return;
    const start = performance.now();
    let lastTickAt = 0;
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      // ease-out cubic so the count slows as it nears target
      const eased = 1 - Math.pow(1 - t, 3);
      const v = Math.round(target * eased);
      el.textContent = String(v);
      // throttle tick SFX to roughly every 90ms
      if (now - lastTickAt > 80 && t < 1) { audio.playCount(); lastTickAt = now; }
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function burstSparkles() {
    const rect = grid.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (i / 22) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 130 + Math.random() * 110;
      s.style.left = (cx - 5) + 'px'; s.style.top = (cy - 5) + 'px';
      s.style.setProperty('--end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
      s.style.background = i % 3 === 0 ? '#FFC73C' : (i % 3 === 1 ? '#F8C8DF' : '#fff');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }
  function startConfetti(n) {
    // Brand-cohesive palette: gold, cream, red outline accent.
    const colors = ['#ffc940', '#fff4c5', '#c92c2c'];
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        const dur = 1700 + Math.random() * 1400;
        const drift = (Math.random() * 220 - 110) + 'px';
        const rot = (Math.random() * 1080 - 540) + 'deg';
        c.style.transition = `transform ${dur}ms linear, opacity ${dur}ms ease-in`;
        document.body.appendChild(c);
        requestAnimationFrame(() => {
          c.style.transform = `translate(${drift}, 110vh) rotate(${rot})`;
          c.style.opacity = '0.4';
        });
        setTimeout(() => c.remove(), dur + 100);
      }, i * 35);
    }
  }
  function spawnOverlayStars(n) {
    overlayStars.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'bg-star';
      const x = Math.random() * 100, y = Math.random() * 100;
      const size = 8 + Math.random() * 18;
      const rot = Math.random() * 360;
      const base = 0.35 + Math.random() * 0.45;
      s.style.left = x + '%'; s.style.top = y + '%';
      s.style.width = size + 'px'; s.style.height = size + 'px';
      s.style.setProperty('--star-tf', `rotate(${rot}deg)`);
      s.style.setProperty('--star-base', base);
      s.style.transform = `rotate(${rot}deg) scale(0.9)`;
      s.style.opacity = base;
      s.style.animationDelay = (Math.random() * 1.4) + 's';
      overlayStars.appendChild(s);
    }
  }

  hintBtn.addEventListener('click', () => {
    if (solved || hintsLeft <= 0) return;
    const wrong = tiles.map((c, slot) => ({ c, slot })).filter(({ c, slot }) => c !== slot);
    if (!wrong.length) return;
    hintsLeft--;
    updateToolBadges();
    const pick = wrong[Math.floor(Math.random() * wrong.length)];
    [getTileEl(pick.slot), getTileEl(pick.c)].forEach(el => {
      el.classList.remove('hint-flash');
      void el.offsetWidth;
      el.classList.add('hint-flash');
    });
  });
  undoBtn.addEventListener('click', () => {
    if (solved || animating || undosLeft <= 0 || !history.length) return;
    undosLeft--;
    updateToolBadges();
    tiles = history.pop();
    for (let s = 0; s < TOTAL; s++) getTileEl(s).style.backgroundPosition = bgPositionFor(tiles[s]);
    updateMergeState();
  });
  const STORE_URL = 'https://play.google.com/store/apps/details?id=in.playsimple.picmerge&hl=en_IN';
  ctaBtn.addEventListener('click', () => {
    // Prefer the ad network's MRAID handler if present (it knows how to safely
    // hand off to the store from within an ad container). Otherwise open
    // directly — works for in-browser testing.
    if (window.mraid && typeof window.mraid.open === 'function') {
      window.mraid.open(STORE_URL);
    } else {
      window.open(STORE_URL, '_blank', 'noopener,noreferrer');
    }
  });
  // ── Asset preloader (critical blocks loader; eager loads in background) ──
  const CRITICAL = ['puzzle-paris.webp'];
  const EAGER = [
    'picmerge-dp.webp',
    'eiffel-ad.webp',
  ];
  (() => {
    const loader = document.getElementById('loader');
    const fillEl = document.getElementById('loaderProgressFill');
    const textEl = document.getElementById('loaderText');
    let loaded = 0;
    let started = false;
    function update() {
      const pct = Math.round((loaded / CRITICAL.length) * 100);
      if (fillEl) fillEl.style.width = pct + '%';
      if (textEl) textEl.textContent = 'Loading ' + pct + '%';
      if (loaded >= CRITICAL.length && !started) {
        started = true;
        setTimeout(hideLoader, 250);
      }
    }
    function hideLoader() {
      if (loader) loader.classList.add('hidden');
      setTimeout(() => { if (loader && loader.parentNode) loader.remove(); }, 500);
    }
    function preload(url, blocking) {
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        if (blocking) { loaded++; update(); }
      };
      const ext = url.split('.').pop().toLowerCase();
      if (ext === 'mp3' || ext === 'wav' || ext === 'ogg') {
        const a = new Audio();
        a.preload = 'auto';
        a.addEventListener('canplaythrough', finish, { once: true });
        a.addEventListener('error', finish, { once: true });
        if (blocking) setTimeout(finish, 6000);
        a.src = url;
      } else {
        const img = new Image();
        img.onload = finish;
        img.onerror = finish;
        img.src = url;
      }
    }
    CRITICAL.forEach(u => preload(u, true));
    EAGER.forEach(u => preload(u, false));
    update();
  })();

  function startPuzzle() {
    if (puzzleStarted) return;
    puzzleStarted = true;
    solved = false;
    animating = false;
    history = [];
    prevMergeKeys = new Set();
    hintsLeft = HINTS_START;
    undosLeft = UNDOS_START;
    assistMovesLeft = 3;
    updateToolBadges();
    grid.classList.remove('won');
    suppressMergeFx = true;
    shuffle();
    render();
    suppressMergeFx = false;
    // Trigger the staggered fly-in animation, then strip the class once
    // the longest delay+duration completes so it doesn't re-fire on resize.
    grid.classList.add('entering');
    setTimeout(() => grid.classList.remove('entering'), 1100);
    // Defer the assist pass until after the fly-in settles so the tap-hint
    // is positioned over the final tile rects (not the mid-flight ones).
    setTimeout(() => applyAssist(), 1150);
  }
})();
</script>
</body>
</html>
