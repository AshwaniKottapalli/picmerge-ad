<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PicMerge</title>
<style>
  :root {
    --bg: #6B5BB7;
    --bg-deep: #5849a3;
    --tile-border: rgba(255,255,255,0.55);
    --gold: #FFC73C;
    --puzzle-img: url('puzzle.webp');
    --crack-1: url('crack1.svg');
    --crack-2: url('crack2.svg');
    --crack-3: url('crack3.svg');
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 20px;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    color: var(--bg-deep);
    font-size: 22px;
  }
  .level {
    font-size: 28px;
    font-weight: 800;
    text-shadow: 0 2px 0 rgba(0,0,0,0.18);
    letter-spacing: 0.5px;
  }
  .coins {
    display: flex; align-items: center; gap: 6px;
    background: #2c2452;
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    font-weight: 700;
    box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }
  .coin {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE27A, #E2A20D 70%, #8a5a00);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #6a4500;
    font-weight: 900;
  }

  /* Puzzle */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .grid {
    --seam: #0e0a24;
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 0;
    padding: 1px 0 0 1px;        /* top + left outer seams */
    background: var(--seam);     /* shows through padding */
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 0 0 2px rgba(255,255,255,0.08);
  }
  .tile {
    background-image: var(--puzzle-img);
    background-size: 300% 300%;
    background-repeat: no-repeat;
    /* right + bottom 1px seam, drawn inside each tile */
    box-shadow: inset -1px -1px 0 var(--seam);
    cursor: grab;
    touch-action: none;
    will-change: transform, background-position;
    position: relative;
  }
  /* merge: hide the seam between two correctly-relative tiles */
  .tile.merged-right { box-shadow: inset 0 -1px 0 var(--seam); }
  .tile.merged-down  { box-shadow: inset -1px 0 0 var(--seam); }
  .tile.merged-right.merged-down { box-shadow: none; }

  /* "aha" micro-win when a merge just happened */
  .tile.merge-flash {
    animation: mergeFlash 600ms ease-out;
  }
  @keyframes mergeFlash {
    0%   { filter: brightness(1); transform: scale(1); }
    25%  { filter: brightness(1.45) drop-shadow(0 0 12px rgba(255,199,60,0.95)); transform: scale(1.04); }
    100% { filter: brightness(1); transform: scale(1); }
  }

  .tile.pressing {
    transform: scale(1.03);
    z-index: 3;
    transition: transform 90ms ease-out;
  }
  .tile.dragging {
    z-index: 10;
    cursor: grabbing;
    /* drop shadow plus full seam borders (lifted out of any merge) */
    box-shadow:
      inset -1px -1px 0 var(--seam),
      inset 1px 0 0 var(--seam),
      inset 0 1px 0 var(--seam),
      0 14px 28px rgba(0,0,0,0.45);
    filter: brightness(1.05);
  }
  .tile.drop-target {
    box-shadow:
      inset -1px -1px 0 var(--seam),
      inset 0 0 0 3px var(--gold);
  }
  /* Crack overlay — added as a child .crack-layer in render() */
  .crack-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 380ms cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 0 0.4px rgba(255,255,255,0.9));
    z-index: 1;
  }
  .tile[data-crack="1"] .crack-layer { opacity: 0.85; background-image: var(--crack-1); }
  .tile[data-crack="2"] .crack-layer { opacity: 0.95; background-image: var(--crack-2); }
  .tile[data-crack="3"] .crack-layer { opacity: 1;    background-image: var(--crack-3); }

  /* Heal flash when a merge wipes the cracks */
  .tile.heal-flash {
    animation: healFlash 600ms ease-out;
  }
  @keyframes healFlash {
    0%   { box-shadow: inset -1px -1px 0 var(--seam); }
    35%  { box-shadow: inset 0 0 0 3px rgba(120, 230, 120, 0.85), 0 0 18px rgba(120, 230, 120, 0.6); }
    100% { box-shadow: inset -1px -1px 0 var(--seam); }
  }

  /* Shatter: tiles fall + rotate + fade on failure */
  .grid.shattered .tile {
    animation: shatterFall 700ms cubic-bezier(0.7, 0, 0.84, 0) forwards;
    pointer-events: none;
  }
  .grid.shattered .tile:nth-child(1) { animation-delay:   0ms; }
  .grid.shattered .tile:nth-child(2) { animation-delay:  60ms; }
  .grid.shattered .tile:nth-child(3) { animation-delay: 120ms; }
  .grid.shattered .tile:nth-child(4) { animation-delay:  90ms; }
  .grid.shattered .tile:nth-child(5) { animation-delay: 150ms; }
  .grid.shattered .tile:nth-child(6) { animation-delay: 210ms; }
  .grid.shattered .tile:nth-child(7) { animation-delay: 180ms; }
  .grid.shattered .tile:nth-child(8) { animation-delay: 240ms; }
  .grid.shattered .tile:nth-child(9) { animation-delay: 300ms; }
  @keyframes shatterFall {
    0%   { transform: scale(1) translateY(0) rotate(0); opacity: 1; }
    20%  { transform: scale(1.05) translateY(-4px) rotate(-2deg); }
    100% { transform: scale(0.7) translateY(60px) rotate(-12deg); opacity: 0; }
  }

  /* Failure end-card theming (red ribbon, shattered photo, retry button) */
  .overlay-fail .ribbon-main {
    background: linear-gradient(180deg, #e85555, #9a1f1f);
    text-shadow: 0 2px 0 rgba(60, 0, 0, 0.55);
  }
  .overlay-fail .ribbon-tail {
    background: linear-gradient(180deg, #9a1f1f, #5a0808);
  }
  .overlay-fail .photo-frame {
    filter: grayscale(0.5) contrast(1.05) brightness(0.85);
    box-shadow:
      0 10px 0 rgba(0,0,0,0.22),
      0 0 30px rgba(232, 85, 85, 0.4);
  }
  .overlay-fail .photo-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: var(--crack-3);
    background-size: 100% 100%;
    opacity: 0.95;
    pointer-events: none;
  }
  .overlay-fail .coin-reward { display: none; }
  .cta-retry {
    background: linear-gradient(180deg, #e85555, #a32525);
    box-shadow: 0 6px 0 #5a0808, 0 12px 18px rgba(0,0,0,0.25);
    text-shadow: 0 2px 0 rgba(60, 0, 0, 0.5);
  }
  .cta-retry:active { transform: translateY(3px); box-shadow: 0 3px 0 #5a0808, 0 6px 10px rgba(0,0,0,0.25); }

  .tile.hint-flash {
    animation: hintFlash 0.9s ease-in-out;
  }
  @keyframes hintFlash {
    0%, 100% { box-shadow: inset -1px -1px 0 var(--seam); }
    50% { box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px rgba(255,199,60,0.8); }
  }
  .tile.locked {
    pointer-events: none;
  }

  /* Footer */
  .footer {
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 14px 0 8px;
  }
  .tool {
    position: relative;
    width: 64px; height: 64px;
    background: #efe9ff;
    border-radius: 18px;
    border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    cursor: pointer;
    font-size: 30px;
  }
  .tool:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .badge {
    position: absolute;
    top: -6px; right: -6px;
    min-width: 22px; height: 22px;
    border-radius: 11px;
    background: #6B5BB7;
    color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
    padding: 0 5px;
  }

  /* Win overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 50, 0.78);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 350ms ease;
    z-index: 20;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-star {
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
    will-change: transform, opacity;
  }
  .overlay-content {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  /* Ribbon banner */
  .ribbon-wrap {
    position: relative;
    width: 92%;
    max-width: 340px;
    height: 78px;
    margin-bottom: 14px;
  }
  .ribbon-tail {
    position: absolute;
    top: 22px;
    width: 56px;
    height: 50px;
    background: linear-gradient(180deg, #c14210, #8a2d08);
    z-index: 1;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
  }
  .ribbon-tail-left {
    left: -6px;
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 28% 50%);
  }
  .ribbon-tail-right {
    right: -6px;
    clip-path: polygon(0% 0%, 100% 0%, 72% 50%, 100% 100%, 0% 100%);
  }
  .ribbon-main {
    position: absolute;
    top: 0;
    left: 28px;
    right: 28px;
    height: 64px;
    background: linear-gradient(180deg, #ff944c, #e8541a);
    color: white;
    font-size: 24px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    text-shadow: 0 2px 0 rgba(120, 30, 0, 0.55);
    letter-spacing: 0.4px;
    z-index: 2;
    box-shadow:
      0 5px 0 rgba(0,0,0,0.18),
      inset 0 -3px 0 rgba(0,0,0,0.12),
      inset 0 2px 0 rgba(255,255,255,0.25);
  }

  /* Photo frame */
  .photo-frame {
    position: relative;
    width: 72%;
    max-width: 280px;
    aspect-ratio: 1 / 1;
    background: var(--puzzle-img) center/cover no-repeat;
    border: 6px solid #fff;
    border-radius: 10px;
    box-shadow:
      0 10px 0 rgba(0,0,0,0.22),
      0 0 0 1px rgba(0,0,0,0.05),
      0 0 30px rgba(255, 199, 60, 0.35);
    margin-bottom: 26px;
  }
  .coin-reward {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 999px;
    padding: 4px 14px 4px 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    color: #2c2452;
    font-size: 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
  }
  .coin-reward .coin {
    width: 26px; height: 26px;
  }

  /* Continue button */
  .cta-continue {
    width: 86%;
    max-width: 320px;
    padding: 18px;
    margin-top: 8px;
    display: block;
    background: linear-gradient(180deg, #6dd053, #36a02b);
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    border: none;
    border-radius: 22px;
    box-shadow: 0 6px 0 #1d6d18, 0 12px 18px rgba(0,0,0,0.25);
    text-shadow: 0 2px 0 rgba(0, 60, 0, 0.35);
    cursor: pointer;
    letter-spacing: 0.6px;
  }
  .cta-continue:active { transform: translateY(3px); box-shadow: 0 3px 0 #1d6d18, 0 6px 10px rgba(0,0,0,0.25); }

  /* Cascading entry animations */
  .overlay .ribbon-wrap,
  .overlay .photo-frame,
  .overlay .cta-continue {
    opacity: 0;
  }
  .overlay .coin-reward { opacity: 0; transform: translateX(-50%) scale(0); }

  .overlay.show .ribbon-wrap { animation: ribbonDrop 600ms 0ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .overlay.show .photo-frame { animation: photoZoom 500ms 250ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .overlay.show .coin-reward { animation: badgePop 500ms 650ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .overlay.show .cta-continue { animation: ctaSlide 450ms 850ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .overlay.show .bg-star { animation: starTwinkle 1400ms ease-in-out infinite; }

  @keyframes ribbonDrop {
    0%   { transform: translateY(-140px) rotate(-4deg); opacity: 0; }
    65%  { transform: translateY(8px) rotate(2deg);    opacity: 1; }
    100% { transform: translateY(0) rotate(0);          opacity: 1; }
  }
  @keyframes photoZoom {
    0%   { transform: scale(0.5);  opacity: 0; }
    70%  { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  @keyframes badgePop {
    0%   { transform: translateX(-50%) scale(0);    opacity: 0; }
    70%  { transform: translateX(-50%) scale(1.25); opacity: 1; }
    100% { transform: translateX(-50%) scale(1);    opacity: 1; }
  }
  @keyframes ctaSlide {
    0%   { transform: translateY(60px); opacity: 0; }
    100% { transform: translateY(0);     opacity: 1; }
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: var(--star-base, 0.5); transform: var(--star-tf) scale(0.9); }
    50%      { opacity: calc(var(--star-base, 0.5) + 0.3); transform: var(--star-tf) scale(1.15); }
  }

  /* Sparkle burst (existing) */
  .sparkle {
    position: fixed;
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 25;
    animation: sparkleBurst 900ms ease-out forwards;
  }
  @keyframes sparkleBurst {
    0%   { transform: translate(0,0) scale(0.4); opacity: 1; }
    100% { transform: var(--end) scale(1.3);     opacity: 0; }
  }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -24px;
    width: 8px; height: 14px;
    border-radius: 2px;
    z-index: 25;
    pointer-events: none;
    will-change: transform, opacity;
  }

  /* Winning grid pulse */
  .grid.won { animation: gridWinPulse 600ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes gridWinPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.06); filter: brightness(1.15) drop-shadow(0 0 30px rgba(255,199,60,0.8)); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <button class="icon-btn" id="muteBtn" aria-label="Sound on">🔊</button>
    <div class="level" id="levelLabel">Level 1</div>
    <div class="coins"><span class="coin">$</span><span>49</span></div>
  </div>

  <div class="stage">
    <div class="grid" id="grid"></div>
  </div>

  <div class="footer">
    <button class="tool" id="hintBtn" aria-label="Hint">💡<span class="badge">3</span></button>
    <button class="tool" id="undoBtn" aria-label="Undo">↶<span class="badge">3</span></button>
  </div>
</div>

<div class="overlay overlay-fail" id="failOverlay">
  <div class="overlay-content">
    <div class="ribbon-wrap">
      <div class="ribbon-tail ribbon-tail-left"></div>
      <div class="ribbon-tail ribbon-tail-right"></div>
      <div class="ribbon-main">Picture Shattered!</div>
    </div>
    <div class="photo-frame"></div>
    <button class="cta-continue cta-retry" id="retryBtn">Try Again</button>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="overlay-stars" id="overlayStars"></div>
  <div class="overlay-content">
    <div class="ribbon-wrap">
      <div class="ribbon-tail ribbon-tail-left"></div>
      <div class="ribbon-tail ribbon-tail-right"></div>
      <div class="ribbon-main">Level Cleared!</div>
    </div>
    <div class="photo-frame">
      <div class="coin-reward">
        <span class="coin">$</span><span>+5</span>
      </div>
    </div>
    <button class="cta-continue" id="ctaBtn">Continue</button>
  </div>
</div>

<script>
(() => {
  const GRID = 3;
  const TOTAL = GRID * GRID;
  const grid = document.getElementById('grid');
  const winOverlay = document.getElementById('winOverlay');
  const failOverlay = document.getElementById('failOverlay');
  const hintBtn = document.getElementById('hintBtn');
  const undoBtn = document.getElementById('undoBtn');
  const ctaBtn = document.getElementById('ctaBtn');
  const retryBtn = document.getElementById('retryBtn');
  const muteBtn = document.getElementById('muteBtn');
  const levelLabel = document.getElementById('levelLabel');

  // Crumble-variant config — picture cracks over time on unmerged tiles.
  const CRACK_TICK_MS = 2500;
  const MAX_CRACK = 3;

  // Level variants — Continue advances to the next one.
  const LEVELS = [
    { image: 'puzzle.webp', title: 'Level 1' },
    { image: 'puzzle2.svg', title: 'Level 2' },
    { image: 'puzzle3.svg', title: 'Level 3' },
  ];
  let currentLevel = 0;

  // ----------------------------------------------------------------------
  // Audio: Web Audio API, procedural pad + SFX.
  // Browsers block audio until user gesture, so we call audio.unlock() on
  // the first pointerdown. Mute button toggles the master gain.
  // ----------------------------------------------------------------------
  const audio = (() => {
    let ctx = null, master = null, sfxBus = null, musicBus = null;
    let muted = false, musicStarted = false;
    let prevMute = 0.7;

    function ensureCtx() {
      if (ctx) return ctx;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();  master.gain.value = 0.7; master.connect(ctx.destination);
        sfxBus = ctx.createGain();  sfxBus.gain.value = 1.0; sfxBus.connect(master);
        musicBus = ctx.createGain(); musicBus.gain.value = 0.22; musicBus.connect(master);
      } catch (e) { /* audio unsupported */ }
      return ctx;
    }
    function unlock() {
      ensureCtx();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      if (!musicStarted && ctx) { startMusic(); musicStarted = true; }
    }
    function tone(freq, dur, { type = 'sine', attack = 0.005, gain = 0.25, bus = sfxBus } = {}) {
      if (!ctx || muted) return;
      const osc = ctx.createOscillator(), env = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      env.gain.value = 0;
      osc.connect(env); env.connect(bus);
      const t = ctx.currentTime;
      env.gain.linearRampToValueAtTime(gain, t + attack);
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    // SFX
    function playPickup() { tone(660, 0.06, { type: 'triangle', gain: 0.14 }); }
    function playDrop()   { tone(330, 0.09, { type: 'triangle', gain: 0.12 }); }
    function playMerge() {
      // bright C-E-G-C arpeggio
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) =>
        setTimeout(() => tone(f, 0.32, { type: 'triangle', gain: 0.22 }), i * 55)
      );
    }
    function playWin() {
      [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) =>
        setTimeout(() => tone(f, 0.45, { type: 'triangle', gain: 0.3 }), i * 110)
      );
    }
    function playCrack() {
      // short, low click — like a glass tap
      tone(140, 0.07, { type: 'sawtooth', gain: 0.13 });
      setTimeout(() => tone(95, 0.05, { type: 'square', gain: 0.08 }), 25);
    }
    function playFail() {
      // descending minor arpeggio — uh-oh
      [392.00, 329.63, 261.63, 196.00].forEach((f, i) =>
        setTimeout(() => tone(f, 0.5, { type: 'sawtooth', gain: 0.22 }), i * 110)
      );
    }
    // Soft ambient pad cycling through chords
    function startMusic() {
      if (!ctx) return;
      const chords = [
        [261.63, 329.63, 392.00], // C
        [220.00, 261.63, 329.63], // Am
        [174.61, 220.00, 261.63], // F
        [196.00, 246.94, 293.66], // G
      ];
      const beatDur = 3.6;
      const pad = [];
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const filt = ctx.createBiquadFilter();
        const env = ctx.createGain();
        osc.type = 'sawtooth';
        osc.detune.value = (i - 1) * 6; // slight chorus
        osc.frequency.value = chords[0][i];
        filt.type = 'lowpass'; filt.frequency.value = 900; filt.Q.value = 1;
        env.gain.value = 0;
        osc.connect(filt); filt.connect(env); env.connect(musicBus);
        osc.start();
        pad.push({ osc, env });
      }
      let beat = 0;
      function nextChord() {
        const chord = chords[beat % chords.length];
        const t = ctx.currentTime;
        pad.forEach((p, i) => {
          p.osc.frequency.linearRampToValueAtTime(chord[i], t + 0.6);
          if (beat === 0) {
            p.env.gain.linearRampToValueAtTime(0.055, t + 1.5);
          }
        });
        beat++;
      }
      nextChord();
      setInterval(nextChord, beatDur * 1000);
    }
    function setMuted(m) {
      muted = m;
      ensureCtx();
      if (master) {
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.linearRampToValueAtTime(m ? 0 : prevMute, t + 0.15);
      }
    }
    function isMuted() { return muted; }
    return { unlock, playPickup, playDrop, playMerge, playWin, playCrack, playFail, setMuted, isMuted };
  })();

  // tiles[slot] = correctIndex of the artwork piece currently in that slot.
  let tiles = [];
  let history = [];
  let solved = false;
  let failed = false;
  let animating = false;
  let prevMergeKeys = new Set();
  let suppressMergeFx = false;
  let crackStages = new Array(TOTAL).fill(0);
  let crackTimerId = null;
  const DRAG_THRESHOLD = 6; // px before we lift the tile

  function isInMergeGroup(slot) {
    const el = getTileEl(slot);
    if (!el) return false;
    if (el.classList.contains('merged-right') || el.classList.contains('merged-down')) return true;
    const col = slot % GRID;
    const row = Math.floor(slot / GRID);
    if (col > 0) {
      const left = getTileEl(slot - 1);
      if (left && left.classList.contains('merged-right')) return true;
    }
    if (row > 0) {
      const up = getTileEl(slot - GRID);
      if (up && up.classList.contains('merged-down')) return true;
    }
    return false;
  }

  function applyCrack(slot) {
    const el = getTileEl(slot);
    if (el) el.dataset.crack = crackStages[slot];
  }

  function healCracks(slots) {
    slots.forEach(s => {
      if (crackStages[s] > 0) {
        crackStages[s] = 0;
        applyCrack(s);
        const el = getTileEl(s);
        if (el) {
          el.classList.remove('heal-flash');
          void el.offsetWidth;
          el.classList.add('heal-flash');
          setTimeout(() => el.classList.remove('heal-flash'), 620);
        }
      }
    });
  }

  function tickCrack() {
    if (solved || failed || animating) return;
    // Vulnerable = unmerged tiles below max
    const vulnerable = [];
    for (let s = 0; s < TOTAL; s++) {
      if (crackStages[s] >= MAX_CRACK) continue;
      if (isInMergeGroup(s)) continue;
      vulnerable.push(s);
    }
    if (!vulnerable.length) return;
    // Spread cracks evenly — pick from the least-cracked vulnerable tiles
    const minLevel = Math.min(...vulnerable.map(s => crackStages[s]));
    const candidates = vulnerable.filter(s => crackStages[s] === minLevel);
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    crackStages[pick]++;
    applyCrack(pick);
    audio.playCrack();
    if (crackStages[pick] >= MAX_CRACK) handleFailure();
  }

  function startCrackTimer() {
    if (crackTimerId !== null) return;
    crackTimerId = setInterval(tickCrack, CRACK_TICK_MS);
  }
  function stopCrackTimer() {
    if (crackTimerId !== null) {
      clearInterval(crackTimerId);
      crackTimerId = null;
    }
  }

  function handleFailure() {
    if (failed || solved) return;
    failed = true;
    stopCrackTimer();
    audio.playFail();
    grid.querySelectorAll('.tile').forEach(t => t.classList.add('locked'));
    grid.classList.add('shattered');
    setTimeout(() => failOverlay.classList.add('show'), 850);
  }

  function bgPositionFor(correctIndex) {
    const col = correctIndex % GRID;
    const row = Math.floor(correctIndex / GRID);
    const step = 100 / (GRID - 1);
    return `${col * step}% ${row * step}%`;
  }

  function render() {
    grid.innerHTML = '';
    tiles.forEach((correctIndex, slot) => {
      const t = document.createElement('div');
      t.className = 'tile';
      t.dataset.slot = slot;
      t.dataset.crack = crackStages[slot] || 0;
      t.style.backgroundPosition = bgPositionFor(correctIndex);
      const crackLayer = document.createElement('div');
      crackLayer.className = 'crack-layer';
      t.appendChild(crackLayer);
      attachDrag(t);
      grid.appendChild(t);
    });
    updateMergeState();
  }

  function shuffle() {
    do {
      tiles = Array.from({ length: TOTAL }, (_, i) => i);
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
      }
    } while (isSolved());
  }

  function isSolved() {
    return tiles.every((c, i) => c === i);
  }

  function getTileEl(slot) {
    return grid.querySelector(`.tile[data-slot="${slot}"]`);
  }

  // Update which tiles "merge" with their right/bottom neighbor.
  // Merge = tile at slot S has correctIndex C, and the slot to its right
  // contains correctIndex C+1 (and C is not on the rightmost column of the
  // source image). Same idea for vertical with C+GRID.
  function updateMergeState() {
    const newKeys = new Set();
    const newPairs = []; // {a, b, dir} for newly-merged pairs
    for (let slot = 0; slot < TOTAL; slot++) {
      const el = getTileEl(slot);
      if (!el) continue;
      el.classList.remove('merged-right', 'merged-down');
      const c = tiles[slot];
      const row = Math.floor(slot / GRID);
      const col = slot % GRID;
      if (col < GRID - 1 && (c % GRID) < GRID - 1 && tiles[slot + 1] === c + 1) {
        el.classList.add('merged-right');
        // logical key by correctIndex pair, so moving an intact merged group
        // doesn't make this look "new"
        const key = `H${c}`;
        newKeys.add(key);
        if (!prevMergeKeys.has(key)) newPairs.push({ a: slot, b: slot + 1, dir: 'R' });
      }
      if (row < GRID - 1 && c < TOTAL - GRID && tiles[slot + GRID] === c + GRID) {
        el.classList.add('merged-down');
        const key = `V${c}`;
        newKeys.add(key);
        if (!prevMergeKeys.has(key)) newPairs.push({ a: slot, b: slot + GRID, dir: 'D' });
      }
    }
    prevMergeKeys = newKeys;
    if (newPairs.length && !suppressMergeFx) onMerge(newPairs);
  }

  // Connected component of merged tiles starting at `slot`. Two tiles are
  // connected if one carries .merged-right/.merged-down pointing at the other.
  function getGroup(slot) {
    const visited = new Set([slot]);
    const queue = [slot];
    while (queue.length) {
      const s = queue.shift();
      const el = getTileEl(s);
      if (!el) continue;
      const row = Math.floor(s / GRID);
      const col = s % GRID;
      // right neighbor
      if (el.classList.contains('merged-right') && col < GRID - 1 && !visited.has(s + 1)) {
        visited.add(s + 1); queue.push(s + 1);
      }
      // left neighbor (left tile is the one carrying merged-right)
      if (col > 0) {
        const left = getTileEl(s - 1);
        if (left && left.classList.contains('merged-right') && !visited.has(s - 1)) {
          visited.add(s - 1); queue.push(s - 1);
        }
      }
      // down neighbor
      if (el.classList.contains('merged-down') && row < GRID - 1 && !visited.has(s + GRID)) {
        visited.add(s + GRID); queue.push(s + GRID);
      }
      // up neighbor
      if (row > 0) {
        const up = getTileEl(s - GRID);
        if (up && up.classList.contains('merged-down') && !visited.has(s - GRID)) {
          visited.add(s - GRID); queue.push(s - GRID);
        }
      }
    }
    return [...visited];
  }

  // "Aha" moment: visual flash + sparkle burst at the seam + chime.
  // Also heals cracks on the merged tiles — the central tension of the variant.
  function onMerge(pairs) {
    audio.playMerge();
    const healSet = new Set();
    pairs.forEach(({ a, b, dir }) => {
      const ea = getTileEl(a), eb = getTileEl(b);
      if (!ea || !eb) return;
      [ea, eb].forEach(el => {
        el.classList.remove('merge-flash');
        void el.offsetWidth;
        el.classList.add('merge-flash');
        setTimeout(() => el.classList.remove('merge-flash'), 650);
      });
      sparkleSeam(ea, eb, dir);
      healSet.add(a); healSet.add(b);
    });
    if (healSet.size) healCracks([...healSet]);
  }

  function sparkleSeam(elA, elB, dir) {
    const rA = elA.getBoundingClientRect();
    const rB = elB.getBoundingClientRect();
    const cx = dir === 'R' ? (rA.right + rB.left) / 2 : (rA.left + rA.right) / 2;
    const cy = dir === 'R' ? (rA.top + rA.bottom) / 2 : (rA.bottom + rB.top) / 2;
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (i / 12) * Math.PI * 2 + Math.random() * 0.4;
      const dist = 28 + Math.random() * 36;
      s.style.left = (cx - 5) + 'px';
      s.style.top = (cy - 5) + 'px';
      s.style.width = '8px';
      s.style.height = '8px';
      s.style.setProperty('--end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
      s.style.background = i % 2 ? '#FFC73C' : '#fff';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  function attachDrag(el) {
    let pid = null;
    let startX = 0, startY = 0;
    let dragging = false;
    let groupSlots = null;    // slots in the group being dragged
    let groupEls = null;      // [{slot, el}] for the group
    let anchorSlot = null;    // slot of the tile the finger is on

    el.addEventListener('pointerdown', (e) => {
      audio.unlock();
      if (solved || failed || animating || pid !== null) return;
      pid = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dragging = false;
      anchorSlot = +el.dataset.slot;
      try { el.setPointerCapture(pid); } catch (_) {}
      el.classList.add('pressing');
      audio.playPickup();
    });

    el.addEventListener('pointermove', (e) => {
      if (e.pointerId !== pid) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        dragging = true;
        el.classList.remove('pressing');
        // Lock in the group at drag start.
        groupSlots = getGroup(anchorSlot);
        groupEls = groupSlots.map(s => ({ slot: s, el: getTileEl(s) }));
        groupEls.forEach(g => g.el.classList.add('dragging'));
      }
      // Scale the whole group uniformly around the ANCHOR's center.
      // Each tile scales around its own center, so without compensation
      // adjacent tiles would overlap by (scale-1)*tileSize at the seam.
      // We push each non-anchor outward by (scale-1) * (slots away from
      // anchor) * tileSize, so all members scale together as a rigid block.
      const k = 0.06;
      const tileW = el.offsetWidth;
      const anchorCol = anchorSlot % GRID;
      const anchorRow = (anchorSlot - anchorCol) / GRID;
      groupEls.forEach(g => {
        const relCol = (g.slot % GRID) - anchorCol;
        const relRow = Math.floor(g.slot / GRID) - anchorRow;
        const sx = k * relCol * tileW;
        const sy = k * relRow * tileW;
        g.el.style.transform = `translate(${dx + sx}px, ${dy + sy}px) scale(${1 + k})`;
      });
      // Hit-test under finger. Setting pointer-events: none on group members
      // for the whole drag breaks implicit pointer capture (per the Pointer
      // Events spec), so we toggle it only synchronously around the lookup.
      groupEls.forEach(g => { g.el.style.pointerEvents = 'none'; });
      const over = document.elementFromPoint(e.clientX, e.clientY);
      groupEls.forEach(g => { g.el.style.pointerEvents = ''; });
      grid.querySelectorAll('.tile.drop-target').forEach(t => {
        if (t !== over) t.classList.remove('drop-target');
      });
      if (over && over.classList && over.classList.contains('tile')) {
        const ts = +over.dataset.slot;
        if (!groupSlots.includes(ts)) over.classList.add('drop-target');
      }
    });

    const finish = (e) => {
      if (e.pointerId !== pid) return;
      pid = null;
      if (!dragging) {
        el.classList.remove('pressing');
        return;
      }
      grid.querySelectorAll('.tile.drop-target').forEach(t => t.classList.remove('drop-target'));

      // Same synchronous pointer-events toggle for the drop hit-test
      groupEls.forEach(g => { g.el.style.pointerEvents = 'none'; });
      const over = document.elementFromPoint(e.clientX, e.clientY);
      groupEls.forEach(g => { g.el.style.pointerEvents = ''; });

      let targetAnchorSlot = null;
      if (over && over.classList && over.classList.contains('tile')) {
        const ts = +over.dataset.slot;
        if (!groupSlots.includes(ts)) targetAnchorSlot = ts;
      }

      if (targetAnchorSlot === null) {
        snapGroupBack(groupEls);
        groupSlots = null; groupEls = null;
        return;
      }
      // Translate the whole group by (target - anchor). If any member goes
      // out of bounds, the move is invalid — snap back.
      const dRow = Math.floor(targetAnchorSlot / GRID) - Math.floor(anchorSlot / GRID);
      const dCol = (targetAnchorSlot % GRID) - (anchorSlot % GRID);
      let valid = true;
      const newSlots = groupEls.map(g => {
        const r = Math.floor(g.slot / GRID) + dRow;
        const c = (g.slot % GRID) + dCol;
        if (r < 0 || r >= GRID || c < 0 || c >= GRID) { valid = false; return -1; }
        return r * GRID + c;
      });
      if (!valid) {
        snapGroupBack(groupEls);
        groupSlots = null; groupEls = null;
        return;
      }
      audio.playDrop();
      performMove(groupEls, newSlots, e.clientX - startX, e.clientY - startY);
      groupSlots = null; groupEls = null;
    };
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
    el.addEventListener('lostpointercapture', finish);
  }

  function snapGroupBack(groupEls) {
    groupEls.forEach(g => {
      g.el.classList.remove('dragging');
      g.el.style.transition = 'transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1)';
      g.el.style.transform = 'translate(0, 0) scale(1)';
    });
    setTimeout(() => {
      groupEls.forEach(g => {
        g.el.style.transition = '';
        g.el.style.transform = '';
      });
    }, 240);
  }

  // Move a group of N tiles to new slots. Tiles currently in the target cells
  // (that aren't part of the moving group) get displaced into the cells the
  // group vacated, paired by slot order. Works for N=1 too (= classic swap).
  function performMove(groupEls, newSlots, dragDx, dragDy) {
    if (animating) return;
    animating = true;
    pushHistory();

    const oldSlots = groupEls.map(g => g.slot);
    const oldSet = new Set(oldSlots);
    const newSet = new Set(newSlots);
    const displaced = newSlots.filter(s => !oldSet.has(s)).sort((a, b) => a - b);
    const vacated  = oldSlots.filter(s => !newSet.has(s)).sort((a, b) => a - b);

    // Natural rect for each slot, computed from layout (offsetLeft/Top).
    // These are unaffected by any in-flight transforms on the tiles, so we
    // don't need to back out the drag translate or scale compensation.
    const gridRect = grid.getBoundingClientRect();
    const rects = {};
    for (let s = 0; s < TOTAL; s++) {
      const el2 = getTileEl(s);
      rects[s] = {
        left: gridRect.left + el2.offsetLeft,
        top:  gridRect.top  + el2.offsetTop,
      };
    }

    // Animate group members from current (dragged + scaled) state to their
    // new slot at scale 1. CSS interpolates translate and scale together so
    // the group keeps its edges aligned throughout the slide.
    groupEls.forEach((g, i) => {
      const tx = rects[newSlots[i]].left - rects[g.slot].left;
      const ty = rects[newSlots[i]].top  - rects[g.slot].top;
      g.el.style.transition = 'transform 240ms cubic-bezier(0.4, 0, 0.2, 1)';
      g.el.style.transform = `translate(${tx}px, ${ty}px) scale(1)`;
      g.el.style.zIndex = '4';
    });
    // Animate displaced tiles into vacated cells
    displaced.forEach((fromS, i) => {
      const toS = vacated[i];
      const el2 = getTileEl(fromS);
      const tx = rects[toS].left - rects[fromS].left;
      const ty = rects[toS].top  - rects[fromS].top;
      el2.style.transition = 'transform 240ms cubic-bezier(0.4, 0, 0.2, 1)';
      el2.style.transform = `translate(${tx}px, ${ty}px)`;
    });

    setTimeout(() => {
      // Apply the data move
      const groupArt = oldSlots.map(s => tiles[s]);
      const displacedArt = displaced.map(s => tiles[s]);
      const next = [...tiles];
      groupEls.forEach((g, i) => { next[newSlots[i]] = groupArt[i]; });
      displaced.forEach((_, i) => { next[vacated[i]] = displacedArt[i]; });
      tiles = next;

      // Reset transforms and refresh artwork on every element that moved
      const touched = new Set([...oldSlots, ...newSlots, ...displaced, ...vacated]);
      touched.forEach(s => {
        const el2 = getTileEl(s);
        el2.classList.remove('dragging');
        el2.style.transition = 'none';
        el2.style.transform = '';
        el2.style.zIndex = '';
        el2.style.backgroundPosition = bgPositionFor(tiles[s]);
      });
      void grid.offsetWidth;
      touched.forEach(s => { getTileEl(s).style.transition = ''; });

      updateMergeState();
      animating = false;
      if (isSolved()) handleWin();
    }, 240);
  }

  function pushHistory() {
    history.push([...tiles]);
    if (history.length > 20) history.shift();
  }

  function handleWin() {
    solved = true;
    stopCrackTimer();
    grid.querySelectorAll('.tile').forEach(t => t.classList.add('locked'));
    audio.playWin();
    grid.classList.add('won');
    burstSparkles();
    startConfetti(48);
    spawnOverlayStars(28);
    setTimeout(() => winOverlay.classList.add('show'), 650);
  }

  function burstSparkles() {
    const rect = grid.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (i / 22) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 130 + Math.random() * 110;
      s.style.left = (cx - 5) + 'px';
      s.style.top = (cy - 5) + 'px';
      s.style.setProperty('--end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
      s.style.background = i % 3 === 0 ? '#FFC73C' : (i % 3 === 1 ? '#F8C8DF' : '#fff');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  function startConfetti(n) {
    const colors = ['#FFC73C', '#F8C8DF', '#ff8e42', '#6dd053', '#a18cf0', '#ffffff'];
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        const dur = 1700 + Math.random() * 1400;
        const drift = (Math.random() * 220 - 110) + 'px';
        const rot = (Math.random() * 1080 - 540) + 'deg';
        c.style.transition = `transform ${dur}ms linear, opacity ${dur}ms ease-in`;
        document.body.appendChild(c);
        // kick off transition next frame
        requestAnimationFrame(() => {
          c.style.transform = `translate(${drift}, 110vh) rotate(${rot})`;
          c.style.opacity = '0.4';
        });
        setTimeout(() => c.remove(), dur + 100);
      }, i * 35);
    }
  }

  const overlayStars = document.getElementById('overlayStars');
  function spawnOverlayStars(n) {
    overlayStars.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'bg-star';
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const size = 8 + Math.random() * 18;
      const rot = Math.random() * 360;
      const base = 0.35 + Math.random() * 0.45;
      s.style.left = x + '%';
      s.style.top = y + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--star-tf', `rotate(${rot}deg)`);
      s.style.setProperty('--star-base', base);
      s.style.transform = `rotate(${rot}deg) scale(0.9)`;
      s.style.opacity = base;
      s.style.animationDelay = (Math.random() * 1.4) + 's';
      overlayStars.appendChild(s);
    }
  }

  // Hint: briefly flash a tile that's out of place and its correct slot
  hintBtn.addEventListener('click', () => {
    if (solved) return;
    const wrong = tiles
      .map((c, slot) => ({ c, slot }))
      .filter(({ c, slot }) => c !== slot);
    if (!wrong.length) return;
    const pick = wrong[Math.floor(Math.random() * wrong.length)];
    const tileEl = getTileEl(pick.slot);
    const targetEl = getTileEl(pick.c);
    [tileEl, targetEl].forEach(el => {
      el.classList.remove('hint-flash');
      void el.offsetWidth;
      el.classList.add('hint-flash');
    });
  });

  undoBtn.addEventListener('click', () => {
    if (solved || animating || !history.length) return;
    const prev = history.pop();
    tiles = prev;
    for (let s = 0; s < TOTAL; s++) {
      getTileEl(s).style.backgroundPosition = bgPositionFor(tiles[s]);
    }
    updateMergeState();
  });

  ctaBtn.addEventListener('click', () => {
    // In production this fires the ad network's "click → store" callback.
    // For testing, cycle to the next level so the loop can be re-played.
    console.log('[PicMerge] Continue → next level (in prod: mraid.open() to store)');
    winOverlay.classList.remove('show');
    setTimeout(() => {
      currentLevel = (currentLevel + 1) % LEVELS.length;
      loadLevel(currentLevel);
    }, 350);
  });

  retryBtn.addEventListener('click', () => {
    console.log('[PicMerge] Retry tapped (in prod: maybe to store after N fails)');
    failOverlay.classList.remove('show');
    setTimeout(() => loadLevel(currentLevel), 350);
  });

  muteBtn.addEventListener('click', () => {
    audio.unlock();
    const nowMuted = !audio.isMuted();
    audio.setMuted(nowMuted);
    muteBtn.textContent = nowMuted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', nowMuted ? 'Sound off' : 'Sound on');
  });

  function loadLevel(idx) {
    const lvl = LEVELS[idx];
    document.documentElement.style.setProperty('--puzzle-img', `url('${lvl.image}')`);
    levelLabel.textContent = lvl.title;
    reset();
  }

  function reset() {
    solved = false;
    failed = false;
    animating = false;
    history = [];
    prevMergeKeys = new Set();
    crackStages = new Array(TOTAL).fill(0);
    stopCrackTimer();
    grid.classList.remove('won', 'shattered');
    suppressMergeFx = true;
    shuffle();
    render();
    suppressMergeFx = false;
    startCrackTimer();
  }

  loadLevel(currentLevel);
})();
</script>
